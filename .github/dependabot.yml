# Dependabot configuration
#
# Keeps SHA-pinned GitHub Actions fresh. Actions in `.github/workflows/` are
# pinned to commit SHAs (WI-09) for supply-chain safety; Dependabot proposes
# PRs when a pinned action publishes a new release so the pins stay current
# without us hand-tracking upstream tags.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # CodeQL requires all its sub-actions (init, analyze, upload-sarif) to run
    # the same version — split bumps break the Analyze job (see PR #302).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
