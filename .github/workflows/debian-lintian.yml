name: Debian Lintian Check

# SSO-15394: verify linux/debian/ against Debian Policy ahead of the
# official-archive ITP. Builds the package with the plain debian/changelog
# version (no PPA series suffix — see ppa.yml for the Launchpad-specific
# variant) and runs lintian --pedantic on both the source and binary
# packages, distinct from ppa.yml which only publishes to Launchpad.

on:
  push:
    branches: [main]
    paths:
      - 'linux/debian/**'
      - '.github/workflows/debian-lintian.yml'
  pull_request:
    paths:
      - 'linux/debian/**'
      - '.github/workflows/debian-lintian.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lintian:
    name: lintian --pedantic
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04

    steps:
      - name: Install git and ca-certificates
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install packaging + build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            devscripts \
            debhelper \
            lintian \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            xvfb

      - name: Copy debian directory
        run: cp -r linux/debian debian

      - name: Build binary package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Run lintian --pedantic
        run: |
          set -o pipefail
          cd ..
          lintian --pedantic --no-tag-display-limit *.changes 2>&1 | tee lintian-report.txt

      - name: Upload lintian report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lintian-report
          path: ../lintian-report.txt
          retention-days: 14
