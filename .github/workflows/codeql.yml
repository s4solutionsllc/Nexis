# CodeQL static analysis for C/C++ (SSO-3375, audit ref C3, WI-13).
#
# Runs on every push and pull request that touches the `native` branch and on
# a weekly cron so we still get coverage during quiet weeks. The 7-day CVE SLA
# in RELEASE.md §6 depends on this scan + Dependabot to surface the bugs the
# maintainer needs to patch.

name: CodeQL

on:
  push:
    branches: [native]
  pull_request:
    branches: [native]
  schedule:
    # Weekly heartbeat — keeps SARIF results fresh even with no merges.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    # SSO-4093 / SSO-7306: run inside the same Resolute (26.04 LTS) container
    # build.yml uses so the CodeQL build path picks up Qt 6.8 (FW-06 floor).
    # Noble's qt6-base-dev is 6.4 and no longer satisfies CMake's minimum;
    # Plucky (25.04) was retired at EOL.
    container:
      image: ubuntu:26.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Install git and ca-certificates
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirror the Linux dependency list from build.yml so CodeQL traces the
      # real build, not a stub.
      - name: Install build dependencies
        run: |
          apt-get install -y -qq \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build (manual)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build -j"$(nproc)"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
