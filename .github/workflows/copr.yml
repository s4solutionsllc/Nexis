name: Publish COPR

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'linux/rpm/**'
      - '.github/workflows/copr.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (e.g. 2.8.3). Defaults to the version in nexis.spec — builds/validates the SRPM only, never publishes'
        required: false

permissions:
  contents: read

jobs:
  build-srpm:
    name: Build + validate SRPM
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            cmake \
            gcc-c++ \
            ninja-build \
            qt6-qtbase-devel \
            qt6-qtcharts-devel \
            qt6-qtsvg-devel \
            qt6-qttools-devel \
            qt6-linguist \
            mesa-libGL-devel \
            curl \
            git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up rpmbuild tree
        run: rpmdev-setuptree

      # Container job runs as a different UID than the one that owns the
      # checked-out tree, so `git archive` below refuses it as "dubious
      # ownership" unless explicitly marked safe.
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Real releases (tag push) fetch the published GitHub release tarball,
      # matching exactly what a COPR/mock builder would fetch. Validation
      # runs (workflow_dispatch, pull_request) have no release tarball to
      # fetch yet, so they package the checked-out tree via `git archive`
      # instead — same %prep/%build path, no dependency on an existing tag.
      - name: Determine version and stage source tarball
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            curl -fsSL \
              "https://github.com/s4solutionsllc/Nexis/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" \
              -o "$HOME/rpmbuild/SOURCES/nexis-${VERSION}.tar.gz"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(sed -n 's/^Version:[[:space:]]*//p' linux/rpm/nexis.spec | head -1)
            fi
            git archive --prefix="Nexis-${VERSION}/" \
              -o "$HOME/rpmbuild/SOURCES/nexis-${VERSION}.tar.gz" HEAD
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version into spec
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed "s/^Version:.*/Version:        ${VERSION}/" \
            linux/rpm/nexis.spec > "$HOME/rpmbuild/SPECS/nexis.spec"

      - name: Build SRPM
        run: |
          rpmbuild -bs "$HOME/rpmbuild/SPECS/nexis.spec"
          ls -lh "$HOME/rpmbuild/SRPMS/"

      # AC1/AC3: prove the spec actually builds cleanly (cmake+ninja %build,
      # not just that the SRPM packages) before this is ever handed to COPR.
      # `rpmbuild --rebuild` runs prep/build/install/binary-package from the
      # SRPM — the same steps a COPR/mock builder would run.
      - name: Full rpmbuild dry-run (rebuild from SRPM)
        run: |
          SRPM=$(ls "$HOME"/rpmbuild/SRPMS/*.src.rpm)
          rpmbuild --rebuild "$SRPM"
          ls -lh "$HOME/rpmbuild/RPMS/"*/*.rpm

      - name: Upload SRPM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srpm
          path: ~/rpmbuild/SRPMS/*.src.rpm
          retention-days: 7

  publish-copr:
    name: Publish to COPR
    runs-on: ubuntu-latest
    needs: build-srpm
    # SSO-99: publishing the live COPR project is a public third-party
    # submission and requires prior board approval. Restrict this job to
    # real tag pushes so a workflow_dispatch validation run (used to smoke-
    # test the SRPM build) can never reach the live publish step. The
    # `copr-publish` environment additionally requires DevOps to configure
    # required reviewers in repo settings before this job can execute at all.
    if: github.event_name == 'push'
    environment: copr-publish

    steps:
      - name: Install copr-cli
        run: pipx install copr-cli

      - name: Configure copr-cli credentials
        run: |
          mkdir -p ~/.config
          {
            echo "[copr-cli]"
            echo "login = ${{ secrets.COPR_LOGIN }}"
            echo "username = ${{ secrets.COPR_USERNAME }}"
            echo "token = ${{ secrets.COPR_TOKEN }}"
            echo "copr_url = https://copr.fedorainfracloud.org"
          } > ~/.config/copr

      # First-run bootstrap: `copr-cli build` requires the project to
      # already exist. `copr-cli get` exits non-zero if it doesn't, so this
      # only creates the project once — every later tag push finds it
      # already there and skips straight to the build.
      - name: Ensure COPR project exists
        run: |
          PROJECT="${{ secrets.COPR_USERNAME }}/nexis"
          if copr-cli get "$PROJECT" >/dev/null 2>&1; then
            echo "COPR project $PROJECT already exists."
          else
            echo "COPR project $PROJECT not found, creating it."
            copr-cli create "$PROJECT" \
              --chroot fedora-44-x86_64 \
              --chroot fedora-43-x86_64 \
              --chroot fedora-rawhide-x86_64 \
              --description "Nexis - Linux & macOS System Optimizer and Monitoring tool" \
              --instructions "https://github.com/s4solutionsllc/Nexis"
          fi

      - name: Download SRPM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srpm
          path: srpm/

      - name: Submit SRPM build to COPR
        run: |
          SRPM=$(ls srpm/*.src.rpm)
          copr-cli build ${{ secrets.COPR_USERNAME }}/nexis "$SRPM"
