name: Publish AUR Package

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.3.4)'
        required: true
      force:
        description: 'Publish even if version is older than current AUR pkgver (use for resyncs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    # contents:write is needed by the post-publish step that commits the
    # regenerated PKGBUILD/.SRCINFO back to `native`. The top-level default
    # stays read-only; only this job is granted write.
    permissions:
      contents: write
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Pin to the branch we publish from and write back to. For
          # workflow_run events checkout would otherwise resolve the default
          # branch HEAD implicitly; being explicit keeps the post-publish
          # `git push origin HEAD:native` a fast-forward.
          ref: native

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
            echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare against currently published AUR version
        id: gate
        # Skip the bump if this is a backport — e.g. a v2.3.x security patch
        # released after v2.4.0. Without this gate, AUR users would be
        # downgraded on every install (audit C2).
        run: |
          NEW_VERSION="${{ steps.version.outputs.VERSION }}"
          FORCE="${{ github.event.inputs.force }}"
          CURRENT_VERSION=$(curl -fsSL --retry 3 \
            "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=nexis" \
            2>/dev/null \
            | awk -F= '/^pkgver=/{print $2; exit}')
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not read current AUR pkgver — proceeding with bump"
            echo "SHOULD_BUMP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "::notice::workflow_dispatch with force=true — bypassing version gate"
            echo "SHOULD_BUMP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$NEW_VERSION" "$CURRENT_VERSION" | sort -V | tail -1)
          if [ "$NEW_VERSION" = "$CURRENT_VERSION" ]; then
            echo "AUR is already at $CURRENT_VERSION — nothing to do"
            echo "SHOULD_BUMP=false" >> "$GITHUB_OUTPUT"
          elif [ "$HIGHEST" = "$NEW_VERSION" ]; then
            echo "New tag $NEW_VERSION > current AUR $CURRENT_VERSION — will bump"
            echo "SHOULD_BUMP=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag $NEW_VERSION is a backport (current AUR is $CURRENT_VERSION) — skipping bump to avoid downgrading users"
            echo "SHOULD_BUMP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD version
        if: steps.gate.outputs.SHOULD_BUMP == 'true'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" linux/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" linux/aur/PKGBUILD

      - name: Publish to AUR
        if: steps.gate.outputs.SHOULD_BUMP == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: nexis
          pkgbuild: linux/aur/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "upgpkg: nexis ${{ steps.version.outputs.VERSION }}"
          updpkgsums: true

      - name: Sync published AUR files back to repo
        if: steps.gate.outputs.SHOULD_BUMP == 'true'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        # Root cause of the recurring linux/aur drift: the steps above sed
        # pkgver/pkgrel into an ephemeral checkout, and KSXGitHub/
        # github-actions-deploy-aur fills sha256sums (updpkgsums) + regenerates
        # .SRCINFO inside *its own* clone of the AUR repo. None of that ever
        # lands back here, so the in-repo copies go stale after every release
        # (found at 2.3.x while AUR was 2.4.0). Pull the authoritative published
        # files straight from AUR cgit and commit them so the repo self-heals.
        run: |
          fetch_aur() {
            curl -fsSL --retry 5 --retry-delay 3 \
              "https://aur.archlinux.org/cgit/aur.git/plain/$1?h=nexis"
          }
          # cgit can lag a few seconds behind the SSH push; wait until it
          # reflects the version we just published before trusting the bytes.
          PUBLISHED_VER=""
          for attempt in $(seq 1 10); do
            PUBLISHED_VER=$(fetch_aur PKGBUILD | awk -F= '/^pkgver=/{print $2; exit}')
            if [ "$PUBLISHED_VER" = "$VERSION" ]; then
              break
            fi
            echo "AUR cgit shows '$PUBLISHED_VER', waiting for '$VERSION' (attempt $attempt/10)"
            sleep 6
          done
          if [ "$PUBLISHED_VER" != "$VERSION" ]; then
            echo "::error::AUR cgit never reflected $VERSION — refusing to commit stale files"
            exit 1
          fi
          fetch_aur PKGBUILD  > linux/aur/PKGBUILD
          fetch_aur .SRCINFO  > linux/aur/.SRCINFO

          if git diff --quiet -- linux/aur/PKGBUILD linux/aur/.SRCINFO; then
            echo "linux/aur/ already matches published AUR state — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linux/aur/PKGBUILD linux/aur/.SRCINFO
          git commit -m "chore(aur): sync packaging files to ${VERSION}" \
            -m "Mirror the published AUR PKGBUILD/.SRCINFO back into the repo so linux/aur/ stops drifting from what users install. These files are CI-managed (pkgver/pkgrel sed'd here, sha256sums + .SRCINFO regenerated by the deploy-aur action), so they cannot be kept correct by hand — this pulls the authoritative post-publish state from AUR cgit."
          # GITHUB_TOKEN-authored pushes do not fire other workflows (same
          # reason noted in lupdate.yml), so this won't retrigger build/codeql
          # or loop back into Release -> this job.
          git push origin HEAD:native
