name: Publish AUR Package

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.3.4)'
        required: true
      force:
        description: 'Publish even if version is older than current AUR pkgver (use for resyncs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    # The sync-back step writes via a PAT (see its env block), so the job needs
    # no elevated GITHUB_TOKEN permissions.
    permissions:
      contents: read
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the branch we publish from. For workflow_run events checkout
          # would otherwise resolve the default branch HEAD implicitly.
          ref: native
          # The sync-back step pushes with a PAT; a persisted GITHUB_TOKEN
          # header would silently override it and the PR's CI would not run.
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
            echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare against currently published AUR version
        id: gate
        # Skip the bump if this is a backport — e.g. a v2.3.x security patch
        # released after v2.4.0. Without this gate, AUR users would be
        # downgraded on every install (audit C2).
        run: |
          NEW_VERSION="${{ steps.version.outputs.VERSION }}"
          FORCE="${{ github.event.inputs.force }}"
          CURRENT_VERSION=$(curl -fsSL --retry 3 \
            "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=nexis" \
            2>/dev/null \
            | awk -F= '/^pkgver=/{print $2; exit}')
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not read current AUR pkgver — proceeding with bump"
            echo "SHOULD_BUMP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "::notice::workflow_dispatch with force=true — bypassing version gate"
            echo "SHOULD_BUMP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$NEW_VERSION" "$CURRENT_VERSION" | sort -V | tail -1)
          if [ "$NEW_VERSION" = "$CURRENT_VERSION" ]; then
            echo "AUR is already at $CURRENT_VERSION — nothing to do"
            echo "SHOULD_BUMP=false" >> "$GITHUB_OUTPUT"
          elif [ "$HIGHEST" = "$NEW_VERSION" ]; then
            echo "New tag $NEW_VERSION > current AUR $CURRENT_VERSION — will bump"
            echo "SHOULD_BUMP=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag $NEW_VERSION is a backport (current AUR is $CURRENT_VERSION) — skipping bump to avoid downgrading users"
            echo "SHOULD_BUMP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD version
        if: steps.gate.outputs.SHOULD_BUMP == 'true'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" linux/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" linux/aur/PKGBUILD

      - name: Publish to AUR
        if: steps.gate.outputs.SHOULD_BUMP == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: nexis
          pkgbuild: linux/aur/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "upgpkg: nexis ${{ steps.version.outputs.VERSION }}"
          updpkgsums: true

      - name: Sync published AUR files back to repo
        if: steps.gate.outputs.SHOULD_BUMP == 'true'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_GIT_URL: ssh://aur@aur.archlinux.org/nexis.git
          # `native` is ruleset-protected (required status checks, no bypass
          # actors), so a direct bot push is rejected — every mirror-back since
          # 2026-08-25 would have failed here. Open a PR instead and let the
          # merge queue land it. That needs a PAT-backed identity: the default
          # GITHUB_TOKEN is blocked from creating PRs in this repo (SSO-24052),
          # and a GITHUB_TOKEN push would not trigger the PR's required checks
          # either. CROWDIN_SYNC_TOKEN (a Crowdin-sync-scoped credential) was
          # reused here and doesn't have push/PR rights against this repo —
          # every mirror-back 403'd (SSO-24952). GITHUB_S4_AGENTS_DELIVERY_RW
          # is the org's repo-write delivery credential for s4solutionsllc
          # repos; use it instead.
          GH_TOKEN: ${{ secrets.GITHUB_S4_AGENTS_DELIVERY_RW }}
        # Root cause of the recurring linux/aur drift: the steps above sed
        # pkgver/pkgrel into an ephemeral checkout, and KSXGitHub/
        # github-actions-deploy-aur fills sha256sums (updpkgsums) + regenerates
        # .SRCINFO inside *its own* clone of the AUR repo. None of that ever
        # lands back here, so the in-repo copies go stale after every release
        # (found at 2.3.x while AUR was 2.4.0). Pull the authoritative published
        # files back and open a PR so the repo self-heals.
        #
        # Source: clone the AUR package repo over SSH. The cgit `plain/`
        # endpoint used previously is served from a replica that lagged the
        # push by more than the 5 minutes we polled on every release that
        # reached this step (2.6.1, 2.10.0), so the mirror never actually
        # happened. The SSH git endpoint is the repo the publish step just
        # pushed to — no replica, no lag.
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CROWDIN_SYNC_TOKEN is not set — cannot open the linux/aur sync PR. The AUR publish itself succeeded."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_sync
          chmod 600 ~/.ssh/aur_sync
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_sync -o IdentitiesOnly=yes"

          AUR_CLONE=$(mktemp -d)
          PUBLISHED_VER=""
          for attempt in $(seq 1 5); do
            rm -rf "$AUR_CLONE"
            if git clone --quiet --depth=1 "$AUR_GIT_URL" "$AUR_CLONE" 2>/dev/null; then
              PUBLISHED_VER=$(awk -F= '/^pkgver=/{print $2; exit}' "$AUR_CLONE/PKGBUILD")
              [ "$PUBLISHED_VER" = "$VERSION" ] && break
            fi
            echo "AUR repo shows '${PUBLISHED_VER:-<clone failed>}', waiting for '$VERSION' (attempt $attempt/5)"
            sleep 10
          done
          if [ "$PUBLISHED_VER" != "$VERSION" ]; then
            echo "::warning::AUR repo does not show $VERSION after 5 attempts. The publish itself succeeded (see the 'Publish to AUR' step); only the in-repo linux/aur mirror was skipped this run. It will self-heal on the next release or a manual re-run. Not failing the job."
            exit 0
          fi

          cp "$AUR_CLONE/PKGBUILD" linux/aur/PKGBUILD
          cp "$AUR_CLONE/.SRCINFO" linux/aur/.SRCINFO

          if git diff --quiet -- linux/aur/PKGBUILD linux/aur/.SRCINFO; then
            echo "linux/aur/ already matches published AUR state — nothing to commit"
            exit 0
          fi

          BRANCH="ci/aur-sync-${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add linux/aur/PKGBUILD linux/aur/.SRCINFO
          git commit -m "chore(aur): sync packaging files to ${VERSION}" \
            -m "Mirror the published AUR PKGBUILD/.SRCINFO back into the repo so linux/aur/ stops drifting from what users install. These files are CI-managed (pkgver/pkgrel sed'd in aur.yml, sha256sums + .SRCINFO regenerated by the deploy-aur action), so they cannot be kept correct by hand — this pulls the authoritative post-publish state from the AUR git repo."
          # Push as the PAT identity (checkout ran with persist-credentials:
          # false, so no GITHUB_TOKEN header is left to override this). A
          # re-run for the same version simply refreshes the branch.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --repo "$GITHUB_REPOSITORY" --base native --head "$BRANCH" \
              --title "chore(aur): sync packaging files to ${VERSION}" \
              --body "Automated by aur.yml after publishing nexis ${VERSION} to the AUR: mirrors the published PKGBUILD/.SRCINFO back into linux/aur/ so the repo copy matches what users install. Auto-merge is enabled; it lands through the merge queue once required checks pass." \
              | grep -oE '[0-9]+$')
          fi
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$PR"
          echo "Opened/updated PR #$PR with auto-merge enabled"
