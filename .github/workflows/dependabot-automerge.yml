name: Dependabot auto-merge

# Patch and minor Dependabot bumps merge once every required check is green.
# Majors take the normal pipeline. SSO-28187.
#
# This job only vets and arms auto-merge, with GITHUB_TOKEN. It reads no secret
# but GITHUB_TOKEN. `native` requires the merge queue and a merge_group event
# started by GITHUB_TOKEN runs no workflow, so dependabot-enqueue.yml (scheduled,
# native code, App token) enqueues the PRs armed here. SSO-28212.
#
# The guard step fails the job when the PR edits this file; such a PR is
# enqueued by hand. A bump of actions/create-github-app-token is never armed
# (the enqueue workflow runs it next to the App key); it is enqueued by hand
# after review.
on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse PRs that edit this workflow
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr diff "$PR_URL" --name-only)
          if printf '%s\n' "$files" | grep -qx '.github/workflows/dependabot-automerge.yml'; then
            echo "::error::PR edits dependabot-automerge.yml; enqueue by hand after review"
            exit 1
          fi
          echo "guard passed: PR does not touch dependabot-automerge.yml"

      - name: Read update type
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor
        if: (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor') && !contains(steps.meta.outputs.dependency-names, 'actions/create-github-app-token')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
