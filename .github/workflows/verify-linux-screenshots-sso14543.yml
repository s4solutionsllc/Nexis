name: Verify Linux ScreenshotTests (SSO-14543, temporary)

# One-off verification for SSO-14543: confirm ScreenshotTests passes
# clean (0 failures) in comparison mode against the freshly regenerated
# Linux baselines, using Qt's offscreen QPA (not xvfb — build.yml's
# Linux job excludes ScreenshotTests because it hangs gathering live
# system data under xvfb; offscreen is untested for that hang). This
# workflow is deleted from the branch before merge.

on:
  workflow_dispatch:

jobs:
  verify:
    name: ScreenshotTests (comparison mode, offscreen QPA)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04

    steps:
      - name: Install git and ca-certificates
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install build dependencies
        run: |
          apt-get install -y -qq \
            build-essential \
            cmake g++ libgl1-mesa-dev \
            qt6-base-dev qt6-charts-dev qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libqt6charts6-dev libqt6svg6-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build screenshot test
        run: cmake --build build --target test-ScreenshotTests -j$(nproc)

      - name: ScreenshotTests (comparison mode)
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -R ScreenshotTests

      - name: Upload screenshot diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs-verify-sso14543
          path: build/tests/test_screenshots/
          if-no-files-found: ignore
          retention-days: 7
