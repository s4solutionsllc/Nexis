name: Publish PPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.3.3)'
        required: true

permissions:
  contents: read

jobs:
  # Build the orig tarball once, share across series
  prepare:
    name: Prepare source tarball
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up already-published orig tarball
        id: orig
        # SSO-23422: `tar czf` over a fresh git checkout is not
        # byte-reproducible (mtimes alone differ run to run, even when the
        # extracted tree diffs zero lines), so "rebuild the orig locally"
        # can never reproduce the exact bytes Launchpad already has on file
        # once a version has published once — and Launchpad silently drops
        # a re-upload of an orig tarball whose content doesn't match what
        # it already holds under that filename (no error, no build
        # record). Ask the archive itself whether this upstream version has
        # a prior publish; if so, its orig tarball is the only one that
        # will ever match, and it must be reused verbatim rather than
        # rebuilt.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          API_URL="https://api.launchpad.net/1.0/~s4solutionsllc/+archive/ubuntu/nexis?ws.op=getPublishedSources&source_name=nexis&exact_match=true"
          REV=$(curl -fsSL "$API_URL" | jq -r --arg v "$VERSION" '
            [.entries[] | select(.source_package_version | startswith($v + "-"))]
            | sort_by(.date_created) | last | .source_package_version // empty')
          echo "PUBLISHED_REV=$REV" >> "$GITHUB_OUTPUT"
          if [ -n "$REV" ]; then
            echo "Found existing publish $REV — will reuse its orig tarball"
          else
            echo "No prior publish found for $VERSION — will build the orig tarball locally"
          fi

      - name: Download archived orig tarball
        id: download
        if: steps.orig.outputs.PUBLISHED_REV != ''
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          REV="${{ steps.orig.outputs.PUBLISHED_REV }}"
          URL="https://launchpad.net/~s4solutionsllc/+archive/ubuntu/nexis/+sourcefiles/nexis/${REV}/nexis_${VERSION}.orig.tar.gz"
          HTTP_CODE=$(curl -sSL -o "nexis_${VERSION}.orig.tar.gz" -w '%{http_code}' "$URL")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "REUSED=true" >> "$GITHUB_OUTPUT"
          else
            echo "Archived orig fetch returned HTTP $HTTP_CODE — falling back to a local build" >&2
            rm -f "nexis_${VERSION}.orig.tar.gz"
            echo "REUSED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify archived orig checksum against published .dsc
        if: steps.download.outputs.REUSED == 'true'
        # Security: the download above is a public HTTPS artifact from a
        # PPA we own, but it must not be trusted by URL alone — confirm its
        # sha256 against the value Launchpad itself already recorded in the
        # matching publish's .dsc before it's used for anything downstream.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          REV="${{ steps.orig.outputs.PUBLISHED_REV }}"
          DSC_URL="https://launchpad.net/~s4solutionsllc/+archive/ubuntu/nexis/+sourcefiles/nexis/${REV}/nexis_${REV}.dsc"
          curl -fsSL -o "nexis_${REV}.dsc" "$DSC_URL"
          # A .dsc lists each file once per checksum section (Checksums-Sha1,
          # Checksums-Sha256, Files/md5); matching on filename alone with no
          # section tracking picks up all of them and concatenates SHA1+
          # SHA256+MD5 into $EXPECTED, which then never string-equals a
          # plain sha256sum output. Scope to the Checksums-Sha256: block only.
          EXPECTED=$(awk -v f="nexis_${VERSION}.orig.tar.gz" '
            /^Checksums-Sha256:/{sec=1; next}
            /^[^ ]/{sec=0}
            sec && $3==f{print $1; exit}
          ' "nexis_${REV}.dsc")
          if [ -z "$EXPECTED" ]; then
            echo "nexis_${VERSION}.orig.tar.gz not listed in $DSC_URL Checksums-Sha256 — refusing to trust the download" >&2
            exit 1
          fi
          ACTUAL=$(sha256sum "nexis_${VERSION}.orig.tar.gz" | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Archived orig tarball checksum mismatch: .dsc says $EXPECTED, downloaded file is $ACTUAL" >&2
            exit 1
          fi
          echo "Archived orig tarball sha256 verified: $ACTUAL"
          rm -f "nexis_${REV}.dsc"

      - name: Checkout
        if: steps.download.outputs.REUSED != 'true'
        # SSO-23401: pin to the immutable v<version> tag, not whatever ref
        # dispatched this workflow. A workflow_dispatch retry run against a
        # branch (native, a hotfix branch, ...) can carry commits made after
        # the tag — CHANGELOG.md entries, unrelated fixes, or even packaging
        # tweaks to this same workflow — and every one of those files ends
        # up inside the orig tarball below. This path only runs when no
        # prior publish exists for this version (see "Look up already-
        # published orig tarball" above); once one does, its tarball is
        # downloaded verbatim instead, since a fresh build here can never
        # reproduce Launchpad's exact bytes (see SSO-23422 CHANGELOG entry).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ steps.version.outputs.VERSION }}

      - name: Create upstream tarball
        if: steps.download.outputs.REUSED != 'true'
        run: |
          set -o pipefail
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          # SSO-3399: previously `… || true`, which swallowed every tar failure.
          # tar exit 1 = "file changed as we read it" — benign and the archive
          # is still valid. Exit 2+ = real failure (missing files, syntax
          # error, fatal I/O) — we want CI to fail loudly on those.
          set +e
          # SSO-23422: reverted the SSO-23401 exclude of ./linux/debian.
          # This path only runs for a version with no prior publish (see
          # above), but the already-published 2.9.1 orig contains
          # linux/debian, and this workflow reuses one code path across all
          # versions — leaving the exclude in place here would make the
          # *next* version's first-ever orig diverge in composition from
          # every prior release for no reason. Flip it back to
          # ./linux/debian only alongside a deliberate version bump, in the
          # same commit, with a CHANGELOG note that orig tarball composition
          # changes from that version forward.
          tar czf "${{ runner.temp }}/nexis_${TAG_VERSION}.orig.tar.gz" \
            --transform "s,^\\.,nexis-${TAG_VERSION}," \
            --exclude='./.git' --exclude='./build' --exclude='./website/dist' \
            --exclude='./website/node_modules' --exclude='./debian' .
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "tar failed with exit code $rc — failing job" >&2
            exit "$rc"
          fi
          mv "${{ runner.temp }}/nexis_${TAG_VERSION}.orig.tar.gz" .
          ls -lh "nexis_${TAG_VERSION}.orig.tar.gz"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orig-tarball
          path: nexis_*.orig.tar.gz
          retention-days: 1

  # Publish to each series using the shared tarball
  publish-ppa:
    name: PPA (${{ matrix.series }})
    runs-on: ubuntu-latest
    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # SSO-3733 / FW-06: Qt floor raised to 6.8 in CMakeLists.txt. Ubuntu
        # 24.04 (Noble) ships Qt 6.4 and 22.04 (Jammy) ships Qt 6.2, so
        # neither series can satisfy the floor from its archive Qt. Questing
        # (25.10) ships Qt 6.8+; Resolute (26.04 LTS) ships Qt 6.8+. Users on
        # Noble/Jammy can install via AppImage or AUR until they upgrade.
        # See RELEASE.md "Currently supported targets" and CHANGELOG.md
        # v2.6.0 [Unreleased] for the user-facing announcement.
        # SSO-7305: added resolute (26.04 LTS) — ships Qt 6.8+.
        # SSO-7306: dropped plucky (25.04) — reached end-of-life, so Launchpad
        # rejects new uploads ("plucky is obsolete and will not accept new
        # uploads"). Resolute (26.04 LTS) is the forward-carrying series.
        # SSO-23401: dropped questing (25.10) — same EOL pattern as plucky
        # above. Launchpad's series API confirms questing is now
        # status=Obsolete/supported=false (26.08.24), which is why the
        # 2.9.1 questing leg silently failed while resolute published
        # cleanly. Resolute (26.04 LTS) remains the sole target until the
        # next series (stonking, currently Active Development) stabilizes.
        series: [resolute]

    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream (pinned to release tag)
        # SSO-23422: match prepare's tag pin so this job's working tree is
        # exactly what the orig tarball (fetched or freshly built) contains.
        # linux/debian/source/format is `3.0 (quilt)`, and dpkg-source
        # diffs the working tree against the orig at build time — anything
        # outside debian/ that doesn't match aborts the build with
        # "unexpected upstream changes".
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ steps.version.outputs.VERSION }}

      - name: Checkout packaging overlay from dispatch ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            linux/debian
          path: _dispatch-ref

      - name: Overlay linux/debian from dispatch ref
        # The packaging fix under test may live on a branch that hasn't
        # been tagged yet (e.g. a hotfix branch retrying a dispatch); the
        # upstream tree above is pinned to the tag, so pull in only
        # linux/debian from whichever ref actually triggered this run. For
        # a tag-push trigger this is a no-op — github.sha is the tag commit.
        run: |
          set -euo pipefail
          rm -rf linux/debian
          mv _dispatch-ref/linux/debian linux/debian
          rm -rf _dispatch-ref

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq devscripts debhelper dput

      - name: Import GPG key
        run: |
          echo "${{ secrets.PPA_GPG_PRIVATE_KEY }}" | gpg --import --batch
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye

      - name: Identify GPG key ID
        id: gpg
        run: |
          KEY_ID=$(gpg --list-secret-keys --keyid-format long 2>/dev/null | grep -m1 'sec' | awk '{print $2}' | cut -d'/' -f2)
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_OUTPUT"

      - name: Download shared tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orig-tarball
          path: ../

      - name: Copy debian directory
        run: cp -r linux/debian debian

      - name: Patch control for Jammy (Qt6OpenGL is a separate package)
        if: matrix.series == 'jammy'
        run: |
          sed -i 's/^\(               qt6-base-dev,\)$/\1\n               libqt6opengl6-dev,/' debian/control

      - name: Update changelog for series
        env:
          DEBEMAIL: luke@s4solutions.ai
          DEBFULLNAME: Luke Simpson
        run: |
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          # SSO-15394 follow-up: linux/debian/changelog's top entry is now
          # Debian revision "-1" (debian-revision-is-zero is a lintian
          # --pedantic error, so "-0" is no longer valid). dch requires the
          # newly appended version to compare strictly greater than that
          # entry; a PPA suffix of "-1~ppa1~<series>1" compares as *lower*
          # than a plain "-1" (Debian version rules sort "~" before
          # end-of-string), so the PPA revision must be at least "-2".
          # SSO-23411: Launchpad rejects re-uploading a version string it has
          # already seen for a series, even if that prior build failed.
          # "2.9.1-2~ppa1~<series>1" was already published (failed build,
          # 2026-08-14), so bump to "-3" for the retry.
          # SSO-23417: "-3" was uploaded by dput and rejected server-side by
          # Launchpad due to an invalid GPG signature (SSO-23408). Whether a
          # rejected-pre-build upload "counts" as seen for version-string
          # purposes is unconfirmed, so bump to "-4" for the next retry
          # rather than risk burning a dispatch on an ambiguous collision.
          dch --newversion "${TAG_VERSION}-4~ppa1~${{ matrix.series }}1" \
              --distribution ${{ matrix.series }} \
              --force-distribution \
              "Release ${TAG_VERSION} for ${{ matrix.series }}"

      - name: Build source package
        env:
          GPG_TTY: /dev/null
        run: |
          echo "${{ secrets.PPA_GPG_PASSPHRASE }}" | \
            debuild -S -sa -d \
              -k${{ steps.gpg.outputs.KEY_ID }} \
              -p"gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback"

      - name: Verify GPG signature before upload
        # SSO-23408: 2.9.1-3~ppa1~{resolute,questing}1 uploaded and Launchpad
        # returned "Successfully uploaded packages", but the upload was
        # silently rejected server-side (never appeared in +packages/+builds).
        # dput's own local check already caught this
        # ("Error checking signature ... SignatureVerifyError: 0") but
        # treats it as non-fatal and uploads anyway, so the real signature
        # defect went unnoticed until Launchpad's rejection was reported by
        # a human days later. Verify locally with plain `gpg --verify` (richer
        # diagnostics than dput's terse one-liner) and fail the job before
        # dput runs, so we stop burning PPA revision numbers on uploads that
        # were never going to be accepted.
        run: |
          set -x
          gpg --version
          echo "--- Verifying .dsc ---"
          gpg --verify --verbose ../nexis_*.dsc
          echo "--- Verifying .changes ---"
          gpg --verify --verbose ../nexis_*_source.changes
          echo "--- Signature packet details (.dsc) ---"
          gpg --list-packets ../nexis_*.dsc | tail -40

      - name: Upload to PPA
        run: dput ppa:s4solutionsllc/nexis ../nexis_*_source.changes
