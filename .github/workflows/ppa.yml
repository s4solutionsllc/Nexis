name: Publish PPA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-ppa:
    name: PPA (${{ matrix.series }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        series: [noble, jammy, plucky]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create source tarball
        run: |
          tar czf ${{ github.workspace }}/nexis-${{ steps.version.outputs.VERSION }}.tar.gz \
            --transform "s,^,nexis-${{ steps.version.outputs.VERSION }}/," \
            --exclude='.git' --exclude='build' --exclude='website/dist' \
            --exclude='website/node_modules' .

      - name: Publish to PPA
        uses: yuezk/publish-ppa-package@v2
        with:
          repository: ppa:s4solutionsllc/nexis
          gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.PPA_GPG_PASSPHRASE }}
          tarball: nexis-${{ steps.version.outputs.VERSION }}.tar.gz
          debian_dir: linux/debian
          series: ${{ matrix.series }}
          revision: '1'
          deb_email: luke@s4solutionsllc.com
          deb_fullname: Luke Simpson
