name: Publish PPA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-ppa:
    name: PPA (${{ matrix.series }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        series: [noble, jammy, plucky]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Symlink debian packaging directory
        run: ln -s linux/debian debian

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to PPA
        uses: yuezk/publish-ppa-package@v2
        with:
          repository: ppa:lsimpsonsfdc/nexis
          gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.PPA_GPG_PASSPHRASE }}
          series: ${{ matrix.series }}
          source_name: nexis
          version: ${{ steps.version.outputs.VERSION }}
          version_suffix: ~ppa1~${{ matrix.series }}1
          revision: '1'
          debian_dir: debian
          build_depends: >-
            debhelper-compat (= 13),
            cmake (>= 3.16),
            g++,
            qt6-base-dev,
            qt6-charts-dev,
            qt6-svg-dev,
            qt6-tools-dev,
            qt6-tools-dev-tools,
            qt6-l10n-tools,
            libgl1-mesa-dev
