# Install tracking (docs/plans/2026-07-05-installation-tracking-findings-and-plan.md
# Phase 3): nightly collector that snapshots per-channel download counts from
# the GitHub Releases API, the Launchpad PPA, and the AUR RPC into
# install-stats.json (one entry per day), then triggers a website rebuild.
# GitHub only exposes *cumulative* counts, so the time series starts the day
# this first runs — dispatch it once at merge to seed day one.
#
# The snapshot lives on the `install-stats` data branch, not on `native`.
# `native` is ruleset-protected (required status checks, no bypass actors), so
# a direct bot push there is rejected — that broke every nightly run from
# 2026-08-25 onward. pages.yml overlays the data-branch file onto
# website/src/data/install-stats.json at build time; the copy committed on
# `native` is only the historical seed / fallback.
name: Install Stats

on:
  schedule:
    # Daily, off the top of the hour to avoid the GitHub cron thundering herd.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_BRANCH: install-stats
  DATA_FILE: website/src/data/install-stats.json

jobs:
  collect:
    name: Collect installation stats
    runs-on: ubuntu-latest
    # contents:write to push the snapshot to the data branch; actions:write to
    # dispatch the pages.yml rebuild (same pattern as release.yml). Scoped to
    # this job only — the top-level default stays read-only.
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: native

      - name: Load history from data branch
        # First run after the branch is introduced falls through to the seed
        # copy on native; every run after that continues the series from the
        # data branch so nothing recorded there is lost.
        run: |
          if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:install-stats.json" > "$DATA_FILE"
            echo "Loaded history from $DATA_BRANCH"
          else
            echo "No $DATA_BRANCH branch yet — seeding from the copy on native"
          fi

      - name: Collect stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/collect_install_stats.py

      - name: Commit snapshot to data branch
        id: commit
        run: |
          set -euo pipefail
          WT=$(mktemp -d)
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add "$WT" FETCH_HEAD
          else
            git worktree add --detach "$WT"
            git -C "$WT" checkout --orphan "bootstrap-$DATA_BRANCH-$$"
            git -C "$WT" rm -rfq .
            cat > "$WT/README.md" <<'README'
          # install-stats

          Machine-written data branch. `install-stats.json` is appended nightly by
          `.github/workflows/install-stats.yml` and read by `pages.yml` at website
          build time. Do not edit by hand and do not merge into `native`.
          README
          fi
          cp "$DATA_FILE" "$WT/install-stats.json"
          cd "$WT"
          if git diff --quiet -- install-stats.json && git ls-files --error-unmatch install-stats.json >/dev/null 2>&1; then
            echo "No stat changes today — nothing to commit"
            echo "PUSHED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(stats): daily install-stats snapshot"
          # GITHUB_TOKEN-authored pushes do not fire other workflows (same
          # pattern as aur.yml's mirror-back step), so this cannot loop.
          git push origin "HEAD:refs/heads/$DATA_BRANCH"
          echo "PUSHED=true" >> "$GITHUB_OUTPUT"

      # The GITHUB_TOKEN push above will NOT trigger pages.yml on its own, so
      # rebuild the website explicitly — otherwise the stats page goes stale.
      - name: Trigger website rebuild
        if: steps.commit.outputs.PUSHED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref native
