name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  # ============================================================================
  # Linux build matrix: x86_64 + ARM64 — .deb + AppImage + raw binary
  # ============================================================================
  build-linux:
    name: Linux Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            linuxdeploy-arch: x86_64
            deb-arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            linuxdeploy-arch: aarch64
            deb-arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            libfuse2 \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            devscripts \
            debhelper \
            debhelper-compat \
            fakeroot \
            xvfb

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DAPP_VERSION_OVERRIDE=${{ steps.version.outputs.VERSION }}

      - name: Build
        run: cmake --build build -j$(nproc)

      # WI-32: Run unit tests against the cmake build before producing the
      # AppImage/raw-binary artifacts so a directly-tagged hotfix can't ship
      # an untested binary. The .deb leg below runs tests separately via
      # debian/rules override_dh_auto_test. Mirrors build.yml.
      - name: Unit Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure -E ScreenshotTests

      # --- .deb package ---
      - name: Symlink debian packaging directory
        run: ln -s linux/debian debian

      - name: Sync debian changelog version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_DEB_VERSION=$(head -1 debian/changelog | grep -oP '\(\K[^)]+' | cut -d- -f1)
          if [ "$CURRENT_DEB_VERSION" != "$TAG_VERSION" ]; then
            echo "Updating debian/changelog from $CURRENT_DEB_VERSION to $TAG_VERSION"
            sed -i "1s/($CURRENT_DEB_VERSION-/(${TAG_VERSION}-/" debian/changelog
          fi

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect and rename .deb file
        id: deb
        run: |
          cp ../nexis_*.deb .
          SRC=$(ls nexis_*.deb | head -1)
          # Rename to include ubuntu2404 suffix for clarity (BUG-75)
          DEST=$(echo "$SRC" | sed 's/\.deb$/_ubuntu2404.deb/')
          mv "$SRC" "$DEST"
          echo "DEB_PATH=$DEST" >> "$GITHUB_OUTPUT"
          echo "DEB_NAME=$DEST" >> "$GITHUB_OUTPUT"

      # --- AppImage ---
      - name: Install to AppDir
        run: DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      # WI-13 / SSO-3375: pin linuxdeploy to a tagged release and verify the
      # SHA256 of the downloaded AppImage. The upstream `continuous` tag is
      # mutable; if it ever ships a backdoored binary, we'd ship it too.
      # Refresh the tag + sums below when bumping. Source of truth:
      #   https://github.com/linuxdeploy/linuxdeploy/releases
      #   https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases
      - name: Download linuxdeploy and Qt plugin (pinned + verified)
        env:
          LINUXDEPLOY_TAG: "1-alpha-20251107-1"
          LINUXDEPLOY_PLUGIN_QT_TAG: "1-alpha-20250213-1"
          LINUXDEPLOY_SHA256_X86_64: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
          LINUXDEPLOY_SHA256_AARCH64: "620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff"
          LINUXDEPLOY_PLUGIN_QT_SHA256_X86_64: "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724"
          LINUXDEPLOY_PLUGIN_QT_SHA256_AARCH64: "bf1c24aff6d749b5cf423afad6f15abd4440f81dec1aab95706b25f6667cdcf1"
          ARCH: ${{ matrix.linuxdeploy-arch }}
        run: |
          set -euo pipefail

          case "$ARCH" in
            x86_64)
              ld_sha="$LINUXDEPLOY_SHA256_X86_64"
              ldq_sha="$LINUXDEPLOY_PLUGIN_QT_SHA256_X86_64"
              ;;
            aarch64)
              ld_sha="$LINUXDEPLOY_SHA256_AARCH64"
              ldq_sha="$LINUXDEPLOY_PLUGIN_QT_SHA256_AARCH64"
              ;;
            *)
              echo "Unknown linuxdeploy arch: $ARCH" >&2
              exit 1
              ;;
          esac

          ld_file="linuxdeploy-${ARCH}.AppImage"
          ldq_file="linuxdeploy-plugin-qt-${ARCH}.AppImage"

          wget -q --tries=3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/${ld_file}"
          wget -q --tries=3 \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_PLUGIN_QT_TAG}/${ldq_file}"

          echo "${ld_sha}  ${ld_file}"   | sha256sum -c -
          echo "${ldq_sha}  ${ldq_file}" | sha256sum -c -

          chmod +x "${ld_file}" "${ldq_file}"

      - name: Build AppImage
        env:
          QMAKE: /usr/bin/qmake6
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./linuxdeploy-${{ matrix.linuxdeploy-arch }}.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/nexis.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/nexis.png \
            --plugin qt \
            --output appimage

      - name: Find AppImage file
        id: appimage
        run: |
          APPIMAGE=$(ls Nexis-*.AppImage | head -1)
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_NAME=$(basename $APPIMAGE)" >> "$GITHUB_OUTPUT"

      - name: Rename binary with architecture
        run: cp build/output/nexis build/output/nexis-${{ matrix.arch }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-artifacts-${{ matrix.arch }}
          path: |
            ${{ steps.deb.outputs.DEB_PATH }}
            ${{ steps.appimage.outputs.APPIMAGE_PATH }}
            build/output/nexis-${{ matrix.arch }}

  # ============================================================================
  # Linux .deb for Ubuntu 25.04+ (Plucky) — built inside container to get
  # correct non-t64 dependency names (BUG-75)
  # ============================================================================
  build-linux-deb-plucky:
    name: Linux .deb Plucky (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:25.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb-arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb-arch: arm64

    steps:
      - name: Install git for checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq git

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install build dependencies
        run: |
          apt-get install -y -qq \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            devscripts \
            debhelper \
            debhelper-compat \
            fakeroot \
            xvfb

      - name: Symlink debian packaging directory
        run: ln -s linux/debian debian

      - name: Sync debian changelog version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_DEB_VERSION=$(head -1 debian/changelog | grep -oP '\(\K[^)]+' | cut -d- -f1)
          if [ "$CURRENT_DEB_VERSION" != "$TAG_VERSION" ]; then
            echo "Updating debian/changelog from $CURRENT_DEB_VERSION to $TAG_VERSION"
            sed -i "1s/($CURRENT_DEB_VERSION-/(${TAG_VERSION}-/" debian/changelog
          fi

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b
        env:
          APP_VERSION_OVERRIDE: ${{ steps.version.outputs.VERSION }}

      - name: Collect and rename .deb file
        id: deb
        run: |
          cp ../nexis_*.deb .
          SRC=$(ls nexis_*.deb | head -1)
          # Rename to include ubuntu2504 suffix for clarity
          DEST=$(echo "$SRC" | sed 's/\.deb$/_ubuntu2504.deb/')
          mv "$SRC" "$DEST"
          echo "DEB_PATH=$DEST" >> "$GITHUB_OUTPUT"
          echo "DEB_NAME=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb-plucky-${{ matrix.arch }}
          path: ${{ steps.deb.outputs.DEB_PATH }}

  # ============================================================================
  # macOS build: .app bundle + .dmg
  # ============================================================================
  build-macos:
    name: macOS Build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            brew install qt@6 && break
            echo "brew install attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check for signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_P12 }}" ] && [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ]; then
            echo "ENABLED=true" >> "$GITHUB_OUTPUT"
          else
            echo "ENABLED=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not configured — falling back to ad-hoc signing"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.ENABLED == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm certificate.p12

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) -DAPP_VERSION_OVERRIDE=${{ steps.version.outputs.VERSION }}

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      # WI-32: Run unit tests against the macOS build before signing/notarizing
      # the .dmg so a directly-tagged hotfix can't ship an untested binary.
      # Mirrors build.yml.
      - name: Unit Tests
        run: ctest --test-dir build --output-on-failure -E ScreenshotTests

      - name: Deploy Qt frameworks into .app bundle
        run: |
          $(brew --prefix qt@6)/bin/macdeployqt build/output/nexis.app -no-strip

      - name: Sign .app bundle (Developer ID)
        if: steps.signing.outputs.ENABLED == 'true'
        run: |
          APP="build/output/nexis.app"

          # Find the Developer ID identity dynamically (avoids hardcoding the org name)
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing with: $IDENTITY"

          # Sign frameworks (inside-out)
          find "$APP/Contents/Frameworks" -name "*.framework" -type d | while read fw; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$fw"
          done
          find "$APP/Contents/Frameworks" -name "*.dylib" | while read lib; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$lib"
          done

          # Sign plugins
          find "$APP/Contents/PlugIns" -name "*.dylib" 2>/dev/null | while read plugin; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$plugin"
          done

          # Sign the .app bundle with entitlements
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --entitlements macos/entitlements.plist \
            --timestamp \
            "$APP"

          # Verify
          codesign --verify --deep --strict "$APP"
          echo "Code signing verified successfully"

      - name: Sign .app bundle (ad-hoc fallback)
        if: steps.signing.outputs.ENABLED != 'true'
        run: |
          codesign --force --deep --sign - build/output/nexis.app

      - name: Create .dmg
        run: |
          sleep 5
          hdiutil create -volname "Nexis" -srcfolder build/output/nexis.app \
            -ov -format UDZO build/output/nexis.dmg

      - name: Sign .dmg (Developer ID)
        if: steps.signing.outputs.ENABLED == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          codesign --force --sign "$IDENTITY" --timestamp build/output/nexis.dmg

      - name: Notarize .dmg
        if: steps.signing.outputs.ENABLED == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$API_KEY" > ~/.private_keys/AuthKey_${API_KEY_ID}.p8

          KEY_ARGS="--key ~/.private_keys/AuthKey_${API_KEY_ID}.p8 --key-id $API_KEY_ID --issuer $API_ISSUER_ID"

          # Submit and capture the submission ID
          SUBMIT_OUTPUT=$(xcrun notarytool submit build/output/nexis.dmg \
            $KEY_ARGS \
            --wait \
            --timeout 30m 2>&1) || true
          echo "$SUBMIT_OUTPUT"

          # Extract submission ID
          SUB_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "Submission ID: $SUB_ID"

          # Check if notarization succeeded
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            # Staple the .app first so the ticket travels with the bundle when
            # extracted from the DMG (e.g. Homebrew cask, drag-to-/Applications).
            # Notarization covers contents submitted in the DMG, so the .app
            # hash is already on the ticket and can be stapled directly.
            xcrun stapler staple build/output/nexis.app
            xcrun stapler validate build/output/nexis.app
            xcrun stapler staple build/output/nexis.dmg
            echo "Notarization and stapling complete"
          else
            echo "::error::Notarization did not succeed. Fetching log..."
            if [ -n "$SUB_ID" ]; then
              xcrun notarytool log "$SUB_ID" $KEY_ARGS 2>&1 || true
              xcrun notarytool info "$SUB_ID" $KEY_ARGS 2>&1 || true
            fi
            rm -rf ~/.private_keys
            exit 1
          fi

          rm -rf ~/.private_keys

      - name: Rename .dmg with version
        id: dmg
        run: |
          mv build/output/nexis.dmg build/output/Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg
          echo "DMG_NAME=Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-artifacts
          path: build/output/Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg

      - name: Cleanup keychain
        if: always() && steps.signing.outputs.ENABLED == 'true'
        run: security delete-keychain build.keychain

  # ============================================================================
  # Create GitHub Release with all artifacts
  # ============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-linux-deb-plucky, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-artifacts-x86_64
          path: artifacts/linux-x86_64

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-artifacts-arm64
          path: artifacts/linux-arm64

      - name: Download Linux x86_64 Plucky .deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-deb-plucky-x86_64
          path: artifacts/linux-deb-plucky-x86_64

      - name: Download Linux ARM64 Plucky .deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-deb-plucky-arm64
          path: artifacts/linux-deb-plucky-arm64

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: List artifacts
        run: find artifacts -type f

      - name: Find artifact files
        id: files
        run: |
          # x86_64
          DEB_X64=$(find artifacts/linux-x86_64 -name '*.deb' | head -1)
          APPIMAGE_X64=$(find artifacts/linux-x86_64 -name '*.AppImage' | head -1)
          BINARY_X64=$(find artifacts/linux-x86_64 -name 'nexis-x86_64' | head -1)
          echo "DEB_X64_PATH=$DEB_X64" >> "$GITHUB_OUTPUT"
          echo "DEB_X64_NAME=$(basename $DEB_X64)" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_X64_PATH=$APPIMAGE_X64" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_X64_NAME=$(basename $APPIMAGE_X64)" >> "$GITHUB_OUTPUT"
          echo "BINARY_X64_PATH=$BINARY_X64" >> "$GITHUB_OUTPUT"

          # ARM64
          DEB_ARM64=$(find artifacts/linux-arm64 -name '*.deb' | head -1)
          APPIMAGE_ARM64=$(find artifacts/linux-arm64 -name '*.AppImage' | head -1)
          BINARY_ARM64=$(find artifacts/linux-arm64 -name 'nexis-arm64' | head -1)
          echo "DEB_ARM64_PATH=$DEB_ARM64" >> "$GITHUB_OUTPUT"
          echo "DEB_ARM64_NAME=$(basename $DEB_ARM64)" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_ARM64_PATH=$APPIMAGE_ARM64" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_ARM64_NAME=$(basename $APPIMAGE_ARM64)" >> "$GITHUB_OUTPUT"
          echo "BINARY_ARM64_PATH=$BINARY_ARM64" >> "$GITHUB_OUTPUT"

          # Plucky .deb (Ubuntu 25.04+)
          DEB_X64_PLUCKY=$(find artifacts/linux-deb-plucky-x86_64 -name '*.deb' | head -1)
          echo "DEB_X64_PLUCKY_PATH=$DEB_X64_PLUCKY" >> "$GITHUB_OUTPUT"
          echo "DEB_X64_PLUCKY_NAME=$(basename $DEB_X64_PLUCKY)" >> "$GITHUB_OUTPUT"

          DEB_ARM64_PLUCKY=$(find artifacts/linux-deb-plucky-arm64 -name '*.deb' | head -1)
          echo "DEB_ARM64_PLUCKY_PATH=$DEB_ARM64_PLUCKY" >> "$GITHUB_OUTPUT"
          echo "DEB_ARM64_PLUCKY_NAME=$(basename $DEB_ARM64_PLUCKY)" >> "$GITHUB_OUTPUT"

          # macOS
          DMG=$(find artifacts/macos -name '*.dmg' | head -1)
          echo "DMG_PATH=$DMG" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$(basename $DMG)" >> "$GITHUB_OUTPUT"

      - name: Delete pre-existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If a release already exists for this tag (e.g. from the pre-rebrand
          # Stacer project), delete it so we start fresh with correct artifacts.
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Deleting pre-existing release for ${{ github.ref_name }}"
            gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes
          else
            echo "No pre-existing release found for ${{ github.ref_name }}"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" to the next "## [" or end of file
          NOTES=$(awk "/^## \\[${TAG_VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "No changelog entry found for version $TAG_VERSION, using tag name"
            NOTES="Release $TAG_VERSION"
          fi

          # Build the full release body with changelog + download table
          {
            echo "## What's New"
            echo ""
            echo "$NOTES"
            echo "---"
            echo ""
            echo "### Downloads"
            echo ""
            echo "#### Linux (x86_64)"
            echo "| Format | File | Description |"
            echo "|--------|------|-------------|"
            echo "| \`.deb\` | \`$(basename ${{ steps.files.outputs.DEB_X64_PATH }})\` | For Ubuntu 24.04–24.10, Debian 12+, Linux Mint 22 |"
            echo "| \`.deb\` | \`$(basename ${{ steps.files.outputs.DEB_X64_PLUCKY_PATH }})\` | For Ubuntu 25.04+ (Plucky and newer) |"
            echo "| \`.AppImage\` | \`$(basename ${{ steps.files.outputs.APPIMAGE_X64_PATH }})\` | Portable — runs on any Linux distro |"
            echo "| Binary | \`nexis\` | Standalone executable (requires Qt6 runtime) |"
            echo ""
            echo "#### Linux (ARM64 / aarch64)"
            echo "| Format | File | Description |"
            echo "|--------|------|-------------|"
            echo "| \`.deb\` | \`$(basename ${{ steps.files.outputs.DEB_ARM64_PATH }})\` | For Ubuntu 24.04–24.10 ARM64 (Raspberry Pi 5, Jetson, Graviton, etc.) |"
            echo "| \`.deb\` | \`$(basename ${{ steps.files.outputs.DEB_ARM64_PLUCKY_PATH }})\` | For Ubuntu 25.04+ ARM64 |"
            echo "| \`.AppImage\` | \`$(basename ${{ steps.files.outputs.APPIMAGE_ARM64_PATH }})\` | Portable ARM64 — runs on any ARM64 Linux distro |"
            echo "| Binary | \`nexis\` | Standalone ARM64 executable (requires Qt6 runtime) |"
            echo ""
            echo "#### macOS (Apple Silicon)"
            echo "| Format | File | Description |"
            echo "|--------|------|-------------|"
            echo "| \`.dmg\` | \`$(basename ${{ steps.files.outputs.DMG_PATH }})\` | macOS disk image for Apple Silicon (M1/M2/M3/M4) |"
            echo ""
            echo "---"
            echo ""
            echo "See assets below for Linux (.deb, .AppImage) and macOS (.dmg) packages."
            echo ""
            echo "**Full Changelog:** https://github.com/s4solutionsllc/Nexis/compare/...${GITHUB_REF_NAME}"
          } > /tmp/release_body.md

          echo "BODY_FILE=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: Nexis ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: false
          body_path: /tmp/release_body.md
          files: |
            ${{ steps.files.outputs.DEB_X64_PATH }}
            ${{ steps.files.outputs.DEB_X64_PLUCKY_PATH }}
            ${{ steps.files.outputs.APPIMAGE_X64_PATH }}
            ${{ steps.files.outputs.BINARY_X64_PATH }}
            ${{ steps.files.outputs.DEB_ARM64_PATH }}
            ${{ steps.files.outputs.DEB_ARM64_PLUCKY_PATH }}
            ${{ steps.files.outputs.APPIMAGE_ARM64_PATH }}
            ${{ steps.files.outputs.BINARY_ARM64_PATH }}
            ${{ steps.files.outputs.DMG_PATH }}

      - name: Trigger website rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref native
