name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Linux build: .deb + AppImage + raw binary
  # ============================================================================
  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            libfuse2 \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            devscripts \
            debhelper \
            debhelper-compat \
            fakeroot

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      # --- .deb package ---
      - name: Symlink debian packaging directory
        run: ln -s linux/debian debian

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb file
        id: deb
        run: |
          cp ../stacer_*.deb .
          DEB=$(ls stacer_*.deb | head -1)
          echo "DEB_PATH=$DEB" >> "$GITHUB_OUTPUT"
          echo "DEB_NAME=$DEB" >> "$GITHUB_OUTPUT"

      # --- AppImage ---
      - name: Install to AppDir
        run: DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      - name: Download linuxdeploy and Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          QMAKE: /usr/bin/qmake6
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/stacer.desktop \
            --icon-file AppDir/usr/share/icons/stacer.png \
            --plugin qt \
            --output appimage

      - name: Find AppImage file
        id: appimage
        run: |
          APPIMAGE=$(ls Stacer-*.AppImage | head -1)
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_NAME=$(basename $APPIMAGE)" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            ${{ steps.deb.outputs.DEB_PATH }}
            ${{ steps.appimage.outputs.APPIMAGE_PATH }}
            build/output/stacer

  # ============================================================================
  # macOS build: .app bundle + .dmg
  # ============================================================================
  build-macos:
    name: macOS Build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt@6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Deploy Qt frameworks into .app bundle
        run: |
          $(brew --prefix qt@6)/bin/macdeployqt build/output/stacer.app
          # macdeployqt modifies the binary and frameworks, invalidating the
          # ad-hoc code signature. Re-sign so macOS doesn't kill the process
          # with "Code Signature Invalid" (SIGKILL) on launch.
          codesign --force --deep --sign - build/output/stacer.app
          # Now create the .dmg from the properly signed bundle
          hdiutil create -volname "Stacer" -srcfolder build/output/stacer.app \
            -ov -format UDZO build/output/stacer.dmg

      - name: Rename .dmg with version
        id: dmg
        run: |
          mv build/output/stacer.dmg build/output/Stacer-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg
          echo "DMG_NAME=Stacer-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: build/output/Stacer-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg

  # ============================================================================
  # Create GitHub Release with all artifacts
  # ============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: List artifacts
        run: find artifacts -type f

      - name: Find artifact files
        id: files
        run: |
          DEB=$(find artifacts/linux -name '*.deb' | head -1)
          APPIMAGE=$(find artifacts/linux -name '*.AppImage' | head -1)
          BINARY=$(find artifacts/linux -name 'stacer' -not -name '*.app' -not -name '*.dmg' | head -1)
          DMG=$(find artifacts/macos -name '*.dmg' | head -1)
          echo "DEB_PATH=$DEB" >> "$GITHUB_OUTPUT"
          echo "DEB_NAME=$(basename $DEB)" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_NAME=$(basename $APPIMAGE)" >> "$GITHUB_OUTPUT"
          echo "BINARY_PATH=$BINARY" >> "$GITHUB_OUTPUT"
          echo "DMG_PATH=$DMG" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$(basename $DMG)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stacer ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Stacer ${{ github.ref_name }}

            ### What's New since v2.1.0

            #### 🐛 Bug Fixes
            - **Feedback form replaced with GitHub Issues launcher (BUG-17)** — The old feedback dialog posted data to the original author's Heroku backend, which has been shut down since 2022. The form has been replaced with a quick-link dialog that opens the appropriate GitHub issue template (bug report, feature request, or general feedback) in the browser. No user data is collected or transmitted.
            - **macOS .app bundle re-signed after macdeployqt** — `macdeployqt` modifies the binary and embedded frameworks, invalidating the ad-hoc code signature. The release workflow now re-signs the bundle (`codesign --force --deep --sign -`) immediately after deployment, preventing the "Code Signature Invalid" / SIGKILL crash that occurred on first launch for macOS users.
            - **Release workflow: .deb artifact copy fixed** — The Debian package was not being copied into the GitHub Actions workspace before the upload step, causing `.deb` uploads to silently fail. The workflow now explicitly copies the `.deb` before the upload action runs.

            #### Improvements
            - **Structured GitHub issue templates** — Added `.github/ISSUE_TEMPLATE/` with separate YAML-based templates for bug reports, feature requests, and general feedback. Each template pre-fills labels, assignees, and structured fields to make triage easier.
            - **Version-independent splashscreen filename** — Splash screen asset renamed from `splashscreen-2.0.1.png` to `splashscreen.png` so future version bumps don't require updating the asset reference in source.

            ---

            ### Full Changelog since v2.1.0

            | Commit | Summary |
            |--------|---------|
            | `27d60a5` | Use version-independent splashscreen filename |
            | `2d10d39` | Replace feedback form with GitHub Issues launcher (BUG-17) |
            | `0ba166d` | Fix macOS release: re-sign app bundle after macdeployqt |
            | `131cc51` | Update macOS install instructions with xattr quarantine fix |
            | `c3d2fdf` | Fix release workflow: copy .deb into workspace before upload |

            ---

            ### Downloads

            #### Linux (x86_64)
            | Format | File | Description |
            |--------|------|-------------|
            | `.deb` | `${{ steps.files.outputs.DEB_NAME }}` | For Ubuntu 22.04+, Debian 12+, Linux Mint 21+ |
            | `.AppImage` | `${{ steps.files.outputs.APPIMAGE_NAME }}` | Portable — runs on any Linux distro |
            | Binary | `stacer` | Standalone executable (requires Qt6 runtime) |

            #### macOS (Apple Silicon)
            | Format | File | Description |
            |--------|------|-------------|
            | `.dmg` | `${{ steps.files.outputs.DMG_NAME }}` | macOS disk image for Apple Silicon (M1/M2/M3/M4) |

            ---

            ### Installation Instructions

            #### Linux — `.deb` (Ubuntu / Debian / Mint)
            ```bash
            # Install the package
            sudo dpkg -i ${{ steps.files.outputs.DEB_NAME }}

            # Fix any missing dependencies
            sudo apt-get install -f

            # Launch
            stacer
            ```

            #### Linux — AppImage (Any Distro)
            ```bash
            # Make executable and run
            chmod +x ${{ steps.files.outputs.APPIMAGE_NAME }}
            ./${{ steps.files.outputs.APPIMAGE_NAME }}
            ```
            > **Note:** AppImage requires FUSE. On Ubuntu 22.04+: `sudo apt install libfuse2`

            #### Linux — Build from Source
            ```bash
            # Install dependencies (Ubuntu/Debian)
            sudo apt install build-essential cmake g++ \
              qt6-base-dev qt6-charts-dev qt6-svg-dev \
              qt6-tools-dev qt6-l10n-tools libgl1-mesa-dev

            # Build
            git clone https://github.com/lsimpsonsfdc/Stacer.git
            cd Stacer && mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)

            # Run
            ./output/stacer
            ```

            #### macOS — `.dmg`
            1. Download `${{ steps.files.outputs.DMG_NAME }}`
            2. Open the `.dmg` and drag **Stacer** to your **Applications** folder
            3. Remove the quarantine attribute (required for unsigned apps):
               ```bash
               xattr -cr /Applications/Stacer.app
               ```
            4. Double-click **Stacer** in Applications to launch

            #### macOS — Build from Source
            ```bash
            # Install dependencies
            brew install qt@6 cmake adwaita-icon-theme

            # Build
            git clone https://github.com/lsimpsonsfdc/Stacer.git
            cd Stacer && mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) ..
            make -j$(sysctl -n hw.ncpu)

            # Run
            open output/stacer.app
            ```

            ---

            ### System Requirements
            - **Linux:** Ubuntu 22.04+ / Debian 12+ / Fedora 36+ — Qt 6.2+, x86_64
            - **macOS:** macOS 13+ (Ventura) — Apple Silicon (ARM64)

            ---
            Built from commit ${{ github.sha }}
          files: |
            ${{ steps.files.outputs.DEB_PATH }}
            ${{ steps.files.outputs.APPIMAGE_PATH }}
            ${{ steps.files.outputs.BINARY_PATH }}
            ${{ steps.files.outputs.DMG_PATH }}
