name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  # ============================================================================
  # Linux build matrix: x86_64 + ARM64 — .deb + AppImage + raw binary
  # ============================================================================
  build-linux:
    name: Linux Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            linuxdeploy-arch: x86_64
            deb-arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            linuxdeploy-arch: aarch64
            deb-arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            libfuse2 \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            devscripts \
            debhelper \
            debhelper-compat \
            fakeroot \
            xvfb

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      # --- .deb package ---
      - name: Symlink debian packaging directory
        run: ln -s linux/debian debian

      - name: Sync debian changelog version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_DEB_VERSION=$(head -1 debian/changelog | grep -oP '\(\K[^)]+' | cut -d- -f1)
          if [ "$CURRENT_DEB_VERSION" != "$TAG_VERSION" ]; then
            echo "Updating debian/changelog from $CURRENT_DEB_VERSION to $TAG_VERSION"
            sed -i "1s/($CURRENT_DEB_VERSION-/(${TAG_VERSION}-/" debian/changelog
          fi

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb file
        id: deb
        run: |
          cp ../nexis_*.deb .
          DEB=$(ls nexis_*.deb | head -1)
          echo "DEB_PATH=$DEB" >> "$GITHUB_OUTPUT"
          echo "DEB_NAME=$DEB" >> "$GITHUB_OUTPUT"

      # --- AppImage ---
      - name: Install to AppDir
        run: DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      - name: Download linuxdeploy and Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy-arch }}.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.linuxdeploy-arch }}.AppImage
          chmod +x linuxdeploy-${{ matrix.linuxdeploy-arch }}.AppImage linuxdeploy-plugin-qt-${{ matrix.linuxdeploy-arch }}.AppImage

      - name: Build AppImage
        env:
          QMAKE: /usr/bin/qmake6
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./linuxdeploy-${{ matrix.linuxdeploy-arch }}.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/nexis.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/nexis.png \
            --plugin qt \
            --output appimage

      - name: Find AppImage file
        id: appimage
        run: |
          APPIMAGE=$(ls Nexis-*.AppImage | head -1)
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_NAME=$(basename $APPIMAGE)" >> "$GITHUB_OUTPUT"

      - name: Rename binary with architecture
        run: cp build/output/nexis build/output/nexis-${{ matrix.arch }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts-${{ matrix.arch }}
          path: |
            ${{ steps.deb.outputs.DEB_PATH }}
            ${{ steps.appimage.outputs.APPIMAGE_PATH }}
            build/output/nexis-${{ matrix.arch }}

  # ============================================================================
  # macOS build: .app bundle + .dmg
  # ============================================================================
  build-macos:
    name: macOS Build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            brew install qt@6 && break
            echo "brew install attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Deploy Qt frameworks into .app bundle
        run: |
          $(brew --prefix qt@6)/bin/macdeployqt build/output/nexis.app \
            -no-strip
          # macdeployqt modifies the binary and frameworks, invalidating the
          # ad-hoc code signature. Re-sign so macOS doesn't kill the process
          # with "Code Signature Invalid" (SIGKILL) on launch.
          codesign --force --deep --sign - build/output/nexis.app
          # Wait for codesign to fully release file handles before creating dmg
          sleep 5
          # Now create the .dmg from the properly signed bundle
          hdiutil create -volname "Nexis" -srcfolder build/output/nexis.app \
            -ov -format UDZO build/output/nexis.dmg

      - name: Rename .dmg with version
        id: dmg
        run: |
          mv build/output/nexis.dmg build/output/Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg
          echo "DMG_NAME=Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: build/output/Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg

  # ============================================================================
  # Create GitHub Release with all artifacts
  # ============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts-x86_64
          path: artifacts/linux-x86_64

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts-arm64
          path: artifacts/linux-arm64

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: List artifacts
        run: find artifacts -type f

      - name: Find artifact files
        id: files
        run: |
          # x86_64
          DEB_X64=$(find artifacts/linux-x86_64 -name '*.deb' | head -1)
          APPIMAGE_X64=$(find artifacts/linux-x86_64 -name '*.AppImage' | head -1)
          BINARY_X64=$(find artifacts/linux-x86_64 -name 'nexis-x86_64' | head -1)
          echo "DEB_X64_PATH=$DEB_X64" >> "$GITHUB_OUTPUT"
          echo "DEB_X64_NAME=$(basename $DEB_X64)" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_X64_PATH=$APPIMAGE_X64" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_X64_NAME=$(basename $APPIMAGE_X64)" >> "$GITHUB_OUTPUT"
          echo "BINARY_X64_PATH=$BINARY_X64" >> "$GITHUB_OUTPUT"

          # ARM64
          DEB_ARM64=$(find artifacts/linux-arm64 -name '*.deb' | head -1)
          APPIMAGE_ARM64=$(find artifacts/linux-arm64 -name '*.AppImage' | head -1)
          BINARY_ARM64=$(find artifacts/linux-arm64 -name 'nexis-arm64' | head -1)
          echo "DEB_ARM64_PATH=$DEB_ARM64" >> "$GITHUB_OUTPUT"
          echo "DEB_ARM64_NAME=$(basename $DEB_ARM64)" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_ARM64_PATH=$APPIMAGE_ARM64" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_ARM64_NAME=$(basename $APPIMAGE_ARM64)" >> "$GITHUB_OUTPUT"
          echo "BINARY_ARM64_PATH=$BINARY_ARM64" >> "$GITHUB_OUTPUT"

          # macOS
          DMG=$(find artifacts/macos -name '*.dmg' | head -1)
          echo "DMG_PATH=$DMG" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$(basename $DMG)" >> "$GITHUB_OUTPUT"

      - name: Delete pre-existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If a release already exists for this tag (e.g. from the pre-rebrand
          # Stacer project), delete it so we start fresh with correct artifacts.
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Deleting pre-existing release for ${{ github.ref_name }}"
            gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes
          else
            echo "No pre-existing release found for ${{ github.ref_name }}"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" to the next "## [" or end of file
          NOTES=$(awk "/^## \\[${TAG_VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "No changelog entry found for version $TAG_VERSION, using tag name"
            NOTES="Release $TAG_VERSION"
          fi

          # Build the full release body with changelog + download table
          {
            echo "## What's New"
            echo ""
            echo "$NOTES"
            echo "---"
            echo ""
            echo "### Downloads"
            echo ""
            echo "#### Linux (x86_64)"
            echo "| Format | File | Description |"
            echo "|--------|------|-------------|"
            echo "| \`.deb\` | \`$(basename ${{ steps.files.outputs.DEB_X64_PATH }})\` | For Ubuntu 22.04+, Debian 12+, Linux Mint 21+ |"
            echo "| \`.AppImage\` | \`$(basename ${{ steps.files.outputs.APPIMAGE_X64_PATH }})\` | Portable — runs on any Linux distro |"
            echo "| Binary | \`nexis\` | Standalone executable (requires Qt6 runtime) |"
            echo ""
            echo "#### Linux (ARM64 / aarch64)"
            echo "| Format | File | Description |"
            echo "|--------|------|-------------|"
            echo "| \`.deb\` | \`$(basename ${{ steps.files.outputs.DEB_ARM64_PATH }})\` | For Ubuntu 22.04+ ARM64 (Raspberry Pi 5, Jetson, Graviton, etc.) |"
            echo "| \`.AppImage\` | \`$(basename ${{ steps.files.outputs.APPIMAGE_ARM64_PATH }})\` | Portable ARM64 — runs on any ARM64 Linux distro |"
            echo "| Binary | \`nexis\` | Standalone ARM64 executable (requires Qt6 runtime) |"
            echo ""
            echo "#### macOS (Apple Silicon)"
            echo "| Format | File | Description |"
            echo "|--------|------|-------------|"
            echo "| \`.dmg\` | \`$(basename ${{ steps.files.outputs.DMG_PATH }})\` | macOS disk image for Apple Silicon (M1/M2/M3/M4) |"
            echo ""
            echo "---"
            echo ""
            echo "See assets below for Linux (.deb, .AppImage) and macOS (.dmg) packages."
            echo ""
            echo "**Full Changelog:** https://github.com/lsimpsonsfdc/Nexis/compare/...${GITHUB_REF_NAME}"
          } > /tmp/release_body.md

          echo "BODY_FILE=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexis ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: false
          body_path: /tmp/release_body.md
          files: |
            ${{ steps.files.outputs.DEB_X64_PATH }}
            ${{ steps.files.outputs.APPIMAGE_X64_PATH }}
            ${{ steps.files.outputs.BINARY_X64_PATH }}
            ${{ steps.files.outputs.DEB_ARM64_PATH }}
            ${{ steps.files.outputs.APPIMAGE_ARM64_PATH }}
            ${{ steps.files.outputs.BINARY_ARM64_PATH }}
            ${{ steps.files.outputs.DMG_PATH }}

      - name: Trigger website rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref native
