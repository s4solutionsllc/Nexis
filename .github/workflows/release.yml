name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Linux build: .deb + AppImage + raw binary
  # ============================================================================
  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            libfuse2 \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            devscripts \
            debhelper \
            debhelper-compat \
            fakeroot

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      # --- .deb package ---
      - name: Symlink debian packaging directory
        run: ln -s linux/debian debian

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb file
        id: deb
        run: |
          cp ../stacer_*.deb .
          DEB=$(ls stacer_*.deb | head -1)
          echo "DEB_PATH=$DEB" >> "$GITHUB_OUTPUT"
          echo "DEB_NAME=$DEB" >> "$GITHUB_OUTPUT"

      # --- AppImage ---
      - name: Install to AppDir
        run: DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      - name: Download linuxdeploy and Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          QMAKE: /usr/bin/qmake6
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/stacer.desktop \
            --icon-file AppDir/usr/share/icons/stacer.png \
            --plugin qt \
            --output appimage

      - name: Find AppImage file
        id: appimage
        run: |
          APPIMAGE=$(ls Stacer-*.AppImage | head -1)
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_NAME=$(basename $APPIMAGE)" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            ${{ steps.deb.outputs.DEB_PATH }}
            ${{ steps.appimage.outputs.APPIMAGE_PATH }}
            build/output/stacer

  # ============================================================================
  # macOS build: .app bundle + .dmg
  # ============================================================================
  build-macos:
    name: macOS Build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt@6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Deploy Qt frameworks into .app bundle
        run: $(brew --prefix qt@6)/bin/macdeployqt build/output/stacer.app -dmg

      - name: Rename .dmg with version
        id: dmg
        run: |
          mv build/output/stacer.dmg build/output/Stacer-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg
          echo "DMG_NAME=Stacer-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: build/output/Stacer-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg

  # ============================================================================
  # Create GitHub Release with all artifacts
  # ============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: List artifacts
        run: find artifacts -type f

      - name: Find artifact files
        id: files
        run: |
          DEB=$(find artifacts/linux -name '*.deb' | head -1)
          APPIMAGE=$(find artifacts/linux -name '*.AppImage' | head -1)
          BINARY=$(find artifacts/linux -name 'stacer' -not -name '*.app' -not -name '*.dmg' | head -1)
          DMG=$(find artifacts/macos -name '*.dmg' | head -1)
          echo "DEB_PATH=$DEB" >> "$GITHUB_OUTPUT"
          echo "DEB_NAME=$(basename $DEB)" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_NAME=$(basename $APPIMAGE)" >> "$GITHUB_OUTPUT"
          echo "BINARY_PATH=$BINARY" >> "$GITHUB_OUTPUT"
          echo "DMG_PATH=$DMG" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$(basename $DMG)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stacer ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Stacer ${{ github.ref_name }}

            ### What's New since v2.0.0

            #### 🍎 macOS Platform Support
            - **Native .app bundle uninstaller** — Scans `/Applications` and `~/Applications`, parses `Info.plist` for display names and versions, filters out Apple system apps, moves to Trash via Finder (recoverable)
            - **Homebrew package manager** — Tree widget grouped by Formula/Cask sections with multi-select checkboxes, search with auto-expand, dry-run dependency confirmation, and async background loading
            - **macOS app icon** — Stacer logo now appears in Finder, Dock, and Spotlight
            - **Sidebar & System Cleaner icons** — Fixed Adwaita theme discovery for Homebrew-installed icon themes
            - **Startup Apps** — Display names from `Info.plist` instead of raw file names; autostart delay via shell sleep wrapper

            #### 🖥️ Cross-Platform Features
            - **GPU load monitoring** — Dashboard and Resources pages show GPU utilization for AMD (sysfs), NVIDIA (nvidia-smi), Intel (frequency ratio), and macOS (IOKit)
            - **Autostart delay option** — Configurable delay before auto-started apps launch
            - **Single-instance enforcement** — Prevents multiple copies via `QLockFile`
            - **Purge vs remove option** — Uninstaller can fully purge packages including config files (Linux)
            - **Pip cache cleaning** — Detects non-standard locations via `PIP_CACHE_DIR`
            - **Git-describe versioning** — App version automatically includes commit count and hash for dev builds

            #### 🐛 Bug Fixes
            - Fix NVIDIA GPU utilization always reading 0% (wrong device index)
            - Fix Homebrew PATH resolution in macOS GUI apps
            - Fix Homebrew packages showing no descriptions (now uses `brew info --json=v2`)
            - Fix update alert and Startup Apps display name on macOS
            - Fix non-English locale parsing (`LC_ALL=C`)
            - Fix swapped memory variables in `/proc/meminfo` parsing
            - Fix CPU speed showing 0 GHz on modern kernels (sysfs cpufreq fallback)
            - Fix macOS crash from double `CFRelease` in GPU detection
            - Replace System Cleaner category icons with Adwaita SVGs

            ---

            ### Downloads

            #### Linux (x86_64)
            | Format | File | Description |
            |--------|------|-------------|
            | `.deb` | `${{ steps.files.outputs.DEB_NAME }}` | For Ubuntu 22.04+, Debian 12+, Linux Mint 21+ |
            | `.AppImage` | `${{ steps.files.outputs.APPIMAGE_NAME }}` | Portable — runs on any Linux distro |
            | Binary | `stacer` | Standalone executable (requires Qt6 runtime) |

            #### macOS (Apple Silicon)
            | Format | File | Description |
            |--------|------|-------------|
            | `.dmg` | `${{ steps.files.outputs.DMG_NAME }}` | macOS disk image for Apple Silicon (M1/M2/M3/M4) |

            ---

            ### Installation Instructions

            #### Linux — `.deb` (Ubuntu / Debian / Mint)
            ```bash
            # Install the package
            sudo dpkg -i ${{ steps.files.outputs.DEB_NAME }}

            # Fix any missing dependencies
            sudo apt-get install -f

            # Launch
            stacer
            ```

            #### Linux — AppImage (Any Distro)
            ```bash
            # Make executable and run
            chmod +x ${{ steps.files.outputs.APPIMAGE_NAME }}
            ./${{ steps.files.outputs.APPIMAGE_NAME }}
            ```
            > **Note:** AppImage requires FUSE. On Ubuntu 22.04+: `sudo apt install libfuse2`

            #### Linux — Build from Source
            ```bash
            # Install dependencies (Ubuntu/Debian)
            sudo apt install build-essential cmake g++ \
              qt6-base-dev qt6-charts-dev qt6-svg-dev \
              qt6-tools-dev qt6-l10n-tools libgl1-mesa-dev

            # Build
            git clone https://github.com/lsimpsonsfdc/Stacer.git
            cd Stacer && mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)

            # Run
            ./output/stacer
            ```

            #### macOS — `.dmg`
            1. Download `${{ steps.files.outputs.DMG_NAME }}`
            2. Open the `.dmg` and drag **Stacer** to your **Applications** folder
            3. On first launch, right-click → **Open** (to bypass Gatekeeper for unsigned apps)

            #### macOS — Build from Source
            ```bash
            # Install dependencies
            brew install qt@6 cmake adwaita-icon-theme

            # Build
            git clone https://github.com/lsimpsonsfdc/Stacer.git
            cd Stacer && mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) ..
            make -j$(sysctl -n hw.ncpu)

            # Run
            open output/stacer.app
            ```

            ---

            ### System Requirements
            - **Linux:** Ubuntu 22.04+ / Debian 12+ / Fedora 36+ — Qt 6.2+, x86_64
            - **macOS:** macOS 13+ (Ventura) — Apple Silicon (ARM64)

            ---
            Built from commit ${{ github.sha }}
          files: |
            ${{ steps.files.outputs.DEB_PATH }}
            ${{ steps.files.outputs.APPIMAGE_PATH }}
            ${{ steps.files.outputs.BINARY_PATH }}
            ${{ steps.files.outputs.DMG_PATH }}
