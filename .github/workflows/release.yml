name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Linux build matrix: x86_64 + ARM64 — .deb + AppImage + raw binary
  # ============================================================================
  build-linux:
    name: Linux Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            linuxdeploy-arch: x86_64
            deb-arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            linuxdeploy-arch: aarch64
            deb-arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            libfuse2 \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            devscripts \
            debhelper \
            debhelper-compat \
            fakeroot

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      # --- .deb package ---
      - name: Symlink debian packaging directory
        run: ln -s linux/debian debian

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb file
        id: deb
        run: |
          cp ../nexis_*.deb .
          DEB=$(ls nexis_*.deb | head -1)
          echo "DEB_PATH=$DEB" >> "$GITHUB_OUTPUT"
          echo "DEB_NAME=$DEB" >> "$GITHUB_OUTPUT"

      # --- AppImage ---
      - name: Install to AppDir
        run: DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      - name: Download linuxdeploy and Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy-arch }}.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.linuxdeploy-arch }}.AppImage
          chmod +x linuxdeploy-${{ matrix.linuxdeploy-arch }}.AppImage linuxdeploy-plugin-qt-${{ matrix.linuxdeploy-arch }}.AppImage

      - name: Build AppImage
        env:
          QMAKE: /usr/bin/qmake6
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./linuxdeploy-${{ matrix.linuxdeploy-arch }}.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/nexis.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/nexis.png \
            --plugin qt \
            --output appimage

      - name: Find AppImage file
        id: appimage
        run: |
          APPIMAGE=$(ls Nexis-*.AppImage | head -1)
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_NAME=$(basename $APPIMAGE)" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts-${{ matrix.arch }}
          path: |
            ${{ steps.deb.outputs.DEB_PATH }}
            ${{ steps.appimage.outputs.APPIMAGE_PATH }}
            build/output/nexis

  # ============================================================================
  # macOS build: .app bundle + .dmg
  # ============================================================================
  build-macos:
    name: macOS Build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt@6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Deploy Qt frameworks into .app bundle
        run: |
          $(brew --prefix qt@6)/bin/macdeployqt build/output/nexis.app
          # macdeployqt modifies the binary and frameworks, invalidating the
          # ad-hoc code signature. Re-sign so macOS doesn't kill the process
          # with "Code Signature Invalid" (SIGKILL) on launch.
          codesign --force --deep --sign - build/output/nexis.app
          # Now create the .dmg from the properly signed bundle
          hdiutil create -volname "Nexis" -srcfolder build/output/nexis.app \
            -ov -format UDZO build/output/nexis.dmg

      - name: Rename .dmg with version
        id: dmg
        run: |
          mv build/output/nexis.dmg build/output/Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg
          echo "DMG_NAME=Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: build/output/Nexis-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg

  # ============================================================================
  # Create GitHub Release with all artifacts
  # ============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts-x86_64
          path: artifacts/linux-x86_64

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts-arm64
          path: artifacts/linux-arm64

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: List artifacts
        run: find artifacts -type f

      - name: Find artifact files
        id: files
        run: |
          # x86_64
          DEB_X64=$(find artifacts/linux-x86_64 -name '*.deb' | head -1)
          APPIMAGE_X64=$(find artifacts/linux-x86_64 -name '*.AppImage' | head -1)
          BINARY_X64=$(find artifacts/linux-x86_64 -name 'nexis' -not -name '*.app' -not -name '*.dmg' | head -1)
          echo "DEB_X64_PATH=$DEB_X64" >> "$GITHUB_OUTPUT"
          echo "DEB_X64_NAME=$(basename $DEB_X64)" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_X64_PATH=$APPIMAGE_X64" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_X64_NAME=$(basename $APPIMAGE_X64)" >> "$GITHUB_OUTPUT"
          echo "BINARY_X64_PATH=$BINARY_X64" >> "$GITHUB_OUTPUT"

          # ARM64
          DEB_ARM64=$(find artifacts/linux-arm64 -name '*.deb' | head -1)
          APPIMAGE_ARM64=$(find artifacts/linux-arm64 -name '*.AppImage' | head -1)
          BINARY_ARM64=$(find artifacts/linux-arm64 -name 'nexis' -not -name '*.app' -not -name '*.dmg' | head -1)
          echo "DEB_ARM64_PATH=$DEB_ARM64" >> "$GITHUB_OUTPUT"
          echo "DEB_ARM64_NAME=$(basename $DEB_ARM64)" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_ARM64_PATH=$APPIMAGE_ARM64" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_ARM64_NAME=$(basename $APPIMAGE_ARM64)" >> "$GITHUB_OUTPUT"
          echo "BINARY_ARM64_PATH=$BINARY_ARM64" >> "$GITHUB_OUTPUT"

          # macOS
          DMG=$(find artifacts/macos -name '*.dmg' | head -1)
          echo "DMG_PATH=$DMG" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$(basename $DMG)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexis ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Nexis ${{ github.ref_name }}

            **Nexis** is a cross-platform system optimizer and monitoring tool for Linux and macOS, forked from [Stacer](https://github.com/oguzhaninan/Stacer) and independently developed.

            ### Highlights

            - Complete rebrand from Stacer to Nexis
            - Native macOS support (Apple Silicon)
            - Linux x86_64 and ARM64 support
            - Light and dark theme support with auto-detection
            - System Cleaner with Dev Tool Caches category (npm, pip, Cargo, Go, Maven, etc.)
            - External disk analyzer launcher (Filelight, Baobab, ncdu, etc.)
            - Improved SVG icons and UI polish

            ---

            ### Downloads

            #### Linux (x86_64)
            | Format | File | Description |
            |--------|------|-------------|
            | `.deb` | `${{ steps.files.outputs.DEB_X64_NAME }}` | For Ubuntu 22.04+, Debian 12+, Linux Mint 21+ |
            | `.AppImage` | `${{ steps.files.outputs.APPIMAGE_X64_NAME }}` | Portable — runs on any Linux distro |
            | Binary | `nexis` | Standalone executable (requires Qt6 runtime) |

            #### Linux (ARM64 / aarch64)
            | Format | File | Description |
            |--------|------|-------------|
            | `.deb` | `${{ steps.files.outputs.DEB_ARM64_NAME }}` | For Ubuntu 22.04+ ARM64 (Raspberry Pi 5, Jetson, Graviton, etc.) |
            | `.AppImage` | `${{ steps.files.outputs.APPIMAGE_ARM64_NAME }}` | Portable ARM64 — runs on any ARM64 Linux distro |
            | Binary | `nexis` | Standalone ARM64 executable (requires Qt6 runtime) |

            #### macOS (Apple Silicon)
            | Format | File | Description |
            |--------|------|-------------|
            | `.dmg` | `${{ steps.files.outputs.DMG_NAME }}` | macOS disk image for Apple Silicon (M1/M2/M3/M4) |

            ---

            ### Installation Instructions

            #### Linux — `.deb` (Ubuntu / Debian / Mint)
            ```bash
            # Install the package (use the correct .deb for your architecture)
            sudo dpkg -i ${{ steps.files.outputs.DEB_X64_NAME }}   # x86_64
            # or
            sudo dpkg -i ${{ steps.files.outputs.DEB_ARM64_NAME }}  # ARM64

            # Fix any missing dependencies
            sudo apt-get install -f

            # Launch
            nexis
            ```

            #### Linux — AppImage (Any Distro)
            ```bash
            # Make executable and run (use the correct AppImage for your architecture)
            chmod +x ${{ steps.files.outputs.APPIMAGE_X64_NAME }}
            ./${{ steps.files.outputs.APPIMAGE_X64_NAME }}
            ```
            > **Note:** AppImage requires FUSE. On Ubuntu 22.04+: `sudo apt install libfuse2`

            #### Linux — Build from Source
            ```bash
            # Install dependencies (Ubuntu/Debian — works on both x86_64 and ARM64)
            sudo apt install build-essential cmake g++ \
              qt6-base-dev qt6-charts-dev qt6-svg-dev \
              qt6-tools-dev qt6-l10n-tools libgl1-mesa-dev

            # Build
            git clone https://github.com/lsimpsonsfdc/Nexis.git
            cd Nexis && mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)

            # Run
            ./output/nexis
            ```

            #### macOS — `.dmg`
            1. Download `${{ steps.files.outputs.DMG_NAME }}`
            2. Open the `.dmg` and drag **Nexis** to your **Applications** folder
            3. Remove the quarantine attribute (required for unsigned apps):
               ```bash
               xattr -cr /Applications/Nexis.app
               ```
            4. Double-click **Nexis** in Applications to launch

            #### macOS — Build from Source
            ```bash
            # Install dependencies
            brew install qt@6 cmake adwaita-icon-theme

            # Build
            git clone https://github.com/lsimpsonsfdc/Nexis.git
            cd Nexis && mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) ..
            make -j$(sysctl -n hw.ncpu)

            # Run
            open output/nexis.app
            ```

            ---

            ### System Requirements
            - **Linux:** Ubuntu 22.04+ / Debian 12+ / Fedora 36+ — Qt 6.2+, x86_64 or ARM64 (aarch64)
            - **macOS:** macOS 13+ (Ventura) — Apple Silicon (ARM64)

            ---
            🤖 Co-authored by [Claude Code](https://claude.ai/claude-code) — Anthropic's AI coding agent.

            Built from commit ${{ github.sha }}
          files: |
            ${{ steps.files.outputs.DEB_X64_PATH }}
            ${{ steps.files.outputs.APPIMAGE_X64_PATH }}
            ${{ steps.files.outputs.BINARY_X64_PATH }}
            ${{ steps.files.outputs.DEB_ARM64_PATH }}
            ${{ steps.files.outputs.APPIMAGE_ARM64_PATH }}
            ${{ steps.files.outputs.BINARY_ARM64_PATH }}
            ${{ steps.files.outputs.DMG_PATH }}
