name: Crowdin Sync

on:
  push:
    branches: [native]
    paths:
      - 'shared/translations/nexis_en.ts'
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # issues: write opens/comments/closes the crowdin-sync-failing alert;
  # actions: read lets it list prior runs of this workflow.
  issues: write
  actions: read

jobs:
  crowdin-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The "Normalize translations with lupdate" step below pushes back to
          # l10n_crowdin_translations using the credential actions/checkout
          # persists. Without this that is the default GITHUB_TOKEN, so the push
          # lands as github-actions[bot] and GitHub holds the pull_request
          # workflow runs it triggers in `action_required` — blocked pending
          # manual approval. The Crowdin PR's required checks then never report
          # and it stalls short of the merge queue (observed on #474 on
          # 2026-09-22: three runs at 02:59 all action_required, cleared only by
          # a manual "Update branch"). Pushing as the PAT-backed identity fires
          # the triggers normally — the same property lupdate.yml's header note
          # relies on. Falls back to GITHUB_TOKEN so the job still runs if the
          # secret is ever unset (the stall returns, but nothing breaks).
          token: ${{ secrets.CROWDIN_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Crowdin Sync
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v2.9.1
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'chore(i18n): new Crowdin translations'
          pull_request_body: >-
            Automated translation update from
            [Crowdin](https://crowdin.com).
            Please review the changes before merging.
          pull_request_base_branch_name: native
          localization_branch_name: l10n_crowdin_translations
          config: crowdin.yml
        env:
          # The default GITHUB_TOKEN authenticates as the Actions bot, which this repo's
          # Settings > Actions > General > Workflow permissions blocks from creating PRs
          # ("GitHub Actions is not permitted to create or approve pull requests", SSO-24052).
          # CROWDIN_SYNC_TOKEN is a PAT-backed secret so the sync authenticates as a real
          # identity instead — narrower blast radius than flipping that repo-wide setting.
          # Falls back to GITHUB_TOKEN until the secret is provisioned (SSO-24054) so the
          # branch-push half of this job (which works today) doesn't regress in the meantime.
          GITHUB_TOKEN: ${{ secrets.CROWDIN_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Install Qt6 LinguistTools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools qt6-tools-dev-tools
          # Debian/Ubuntu Qt6 packaging installs tools under /usr/lib/qt6/bin,
          # not on PATH by default (unlike the Qt5 packaging this repo used before).
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Normalize translations with lupdate
        run: |
          set -euo pipefail
          # crowdin/github-action is a Docker container action that runs as root
          # inside the container, and its own git operations (branch switch, push)
          # leave the bind-mounted .git/ owned by root. This step runs as the
          # unprivileged runner user, so reclaim ownership before touching git —
          # otherwise `git commit` fails with "could not open .git/COMMIT_EDITMSG:
          # Permission denied" (SSO-24079).
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          # lupdate.yml is workflow_dispatch-only (manual backstop) precisely so it
          # never runs automatically on the Crowdin push to l10n_crowdin_translations,
          # regardless of which token/actor made that push. This is the single
          # authoritative normalization path — do it here, in the same job, then
          # commit it back to the localization branch so the PR Crowdin opened
          # picks it up.
          if ! git ls-remote --exit-code --heads origin l10n_crowdin_translations >/dev/null; then
            echo "No l10n_crowdin_translations branch — nothing to normalize."
            exit 0
          fi
          git fetch origin l10n_crowdin_translations
          git checkout -B l10n_crowdin_translations origin/l10n_crowdin_translations
          lupdate -recursive shared/ macos/ linux/ \
            -ts shared/translations/nexis_en.ts \
            -no-obsolete
          if git diff --quiet -- 'shared/translations/*.ts'; then
            echo "lupdate produced no changes — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/translations/*.ts
          git commit -m 'chore(i18n): normalize with lupdate'
          git push origin l10n_crowdin_translations

      # This job went red on every run from 2026-09-22 to 2026-11-15 (SSO-27417) and
      # nobody noticed, so the third consecutive failure opens ONE tracking issue and
      # later failures comment on it instead of opening more. It authenticates with the
      # job's GITHUB_TOKEN, not the sync PAT, so it still works when that PAT is the
      # thing that broke. The issue is closed again on the next successful run.
      - name: Alert on repeated failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          prior=$(gh run list --workflow crowdin-sync.yml --branch native --status completed \
            --limit 2 --json conclusion --jq '[.[] | select(.conclusion == "failure")] | length')
          if [ "$prior" -lt 2 ]; then
            echo "Fewer than three consecutive failures — not alerting yet."
            exit 0
          fi
          gh label create crowdin-sync-failing --color B60205 \
            --description 'Scheduled Crowdin Sync has failed repeatedly' 2>/dev/null || true
          existing=$(gh issue list --state open --label crowdin-sync-failing \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Crowdin Sync failed again: $RUN_URL"
          else
            gh issue create --label crowdin-sync-failing \
              --title 'Crowdin Sync has failed three runs in a row' \
              --body "The scheduled Crowdin Sync workflow has failed at least three consecutive runs, so Crowdin translations are not reaching the repo. Latest run: $RUN_URL. This issue is updated on further failures and closed automatically by the next successful run."
          fi

      - name: Close failure alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label crowdin-sync-failing --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Crowdin Sync succeeded again: $RUN_URL"
          done
