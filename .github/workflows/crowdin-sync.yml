name: Crowdin Sync

on:
  push:
    branches: [native]
    paths:
      - 'shared/translations/nexis_en.ts'
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Crowdin Sync
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2.9.1
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'chore(i18n): new Crowdin translations'
          pull_request_body: >-
            Automated translation update from
            [Crowdin](https://crowdin.com).
            Please review the changes before merging.
          pull_request_base_branch_name: native
          localization_branch_name: l10n_crowdin_translations
          config: crowdin.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
