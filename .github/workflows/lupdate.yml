name: Qt lupdate

on:
  push:
    branches:
      - l10n_crowdin_translations

# Primary normalization path is inlined in crowdin-sync.yml because the
# Crowdin action uses GITHUB_TOKEN, whose pushes do not fire workflow
# triggers. This workflow is kept as a manual/edge-case backstop for
# pushes to l10n_crowdin_translations from a non-token actor; the
# explicit permissions block is required for its commit step.
permissions:
  contents: write

jobs:
  lupdate:
    name: Normalize translation files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt6 LinguistTools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools qt6-tools-dev-tools

      - name: Run lupdate
        run: |
          lupdate -recursive shared/ macos/ linux/ \
            -ts shared/translations/nexis_en.ts \
            -no-obsolete

      - name: Commit normalized translations
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: 'chore(i18n): normalize with lupdate'
          add: 'shared/translations/*.ts'
          default_author: github_actions
