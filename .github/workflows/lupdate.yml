name: Qt lupdate

on:
  workflow_dispatch:

# Primary normalization path is inlined in crowdin-sync.yml, which is the
# single authoritative normalizer for l10n_crowdin_translations. This
# workflow is workflow_dispatch-only — a manual edge-case backstop — and
# deliberately does NOT trigger on push: a push-triggered run here would
# race the inline normalize step in crowdin-sync.yml (both commit
# 'chore(i18n): normalize with lupdate' to the same branch), which is
# exactly the failure mode this workflow must not reintroduce now that
# CROWDIN_SYNC_TOKEN pushes (a non-token-actor push) can fire triggers.
# The explicit permissions block is required for its commit step.
permissions:
  contents: write

jobs:
  lupdate:
    name: Normalize translation files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt6 LinguistTools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools qt6-tools-dev-tools
          # Debian/Ubuntu Qt6 packaging installs tools under /usr/lib/qt6/bin,
          # not on PATH by default (unlike the Qt5 packaging this repo used before).
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Run lupdate
        run: |
          lupdate -recursive shared/ macos/ linux/ \
            -ts shared/translations/nexis_en.ts \
            -no-obsolete

      - name: Commit normalized translations
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: 'chore(i18n): normalize with lupdate'
          add: 'shared/translations/*.ts'
          default_author: github_actions
