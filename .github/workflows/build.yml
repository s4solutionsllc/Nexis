name: Build

on:
  push:
    branches: [native, master, main]
  pull_request:
    branches: [native, master, main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux (x64)
            artifact-name: nexis-linux-x64
            artifact-path: build/output/nexis
          - os: ubuntu-24.04-arm
            name: Linux (ARM64)
            artifact-name: nexis-linux-arm64
            artifact-path: build/output/nexis
          - os: macos-14
            name: macOS (ARM64)
            artifact-name: nexis-macos-arm64
            artifact-path: build/output/nexis.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Linux dependencies ---
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            g++ \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev

      # --- macOS dependencies ---
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@6

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu 2>/dev/null || nproc)

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 14
