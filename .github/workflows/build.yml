name: Build

on:
  push:
    branches: [native, master, main]
  pull_request:
    branches: [native, master, main]
  # Required by GitHub merge queue (SSO-23951): a queued PR is tested as a
  # speculative merge commit on a `merge_group` event, not a `pull_request` one.
  # Without this trigger the required check never reports and the entry stalls in
  # the queue forever. Harmless no-op until the queue is switched on.
  merge_group:
  workflow_dispatch:

jobs:
  # Linux build matrix runs inside a Resolute (26.04 LTS) container — see
  # SSO-4093 / SSO-7306. FW-06 raised the Qt floor to 6.8 LTS (SSO-3733), which
  # Noble's apt does not ship. The container was Plucky (25.04) until SSO-7306
  # moved it to Resolute (26.04 LTS) when Plucky reached end-of-life — its apt
  # archive moves to old-releases and the container build would break. Resolute
  # is an LTS (supported to 2031) and ships Qt 6.8+. The runner itself stays on
  # ubuntu-24.04 / ubuntu-24.04-arm because that is what GitHub provides for the
  # matching arch — the build environment comes from the container image.
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            artifact-name: nexis-linux-x64
          - arch: ARM64
            runner: ubuntu-24.04-arm
            artifact-name: nexis-linux-arm64

    steps:
      # The base ubuntu:26.04 image is minimal — install the bits actions/checkout
      # and the architecture-gate scripts rely on before any other step runs.
      - name: Install git and ca-certificates
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WI-30: keep the living architecture/overview docs in sync with the
      # CMake project version. Cheap, no dependencies — runs on every matrix
      # leg so a drift is caught on the same PR that introduces it.
      - name: Doc version header check
        run: bash scripts/check_doc_versions.sh

      # WI-27 (SSO-3389): shared/nexis/Pages must reach platform-specific Info
      # subclasses through InfoManager — never via direct *_macos.h / *_linux.h
      # includes. Run on every platform so the failure surfaces uniformly.
      - name: Architecture gate — no platform headers in shared/Pages
        run: bash scripts/check-pages-no-platform-headers.sh

      - name: Install build dependencies
        run: |
          apt-get install -y -qq \
            build-essential \
            cmake \
            g++ \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            xvfb \
            nethogs

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure -E ScreenshotTests

      # ScreenshotTests are intentionally NOT run on the Linux per-PR jobs:
      # there are no committed Linux baselines (so the comparison always QSKIPs —
      # no regression value), and the test hangs indefinitely under xvfb while
      # gathering live system data on both ARM64 (commit 5c173c7) and x64 (PR
      # #209) Linux runners. Linux visual checks run on demand via the
      # `Regenerate Screenshot Baselines` workflow (workflow_dispatch) and the
      # local build cycle (`ctest -R ScreenshotTests`). The macOS job below keeps
      # the per-PR screenshot guard, where baselines exist and rendering is
      # deterministic.

      # SSO-23450: this binary has no downstream consumer in CI — it exists
      # purely for a maintainer to grab a build without waiting on a release.
      # It was previously uploaded on every push to native/master/main,
      # which at this repo's merge cadence (10+ pushes/day) dwarfed every
      # other artifact category combined. Compile+test still run on every
      # push/PR for CI signal; only the upload is gated behind a manual
      # workflow_dispatch, so a maintainer can still grab a build on demand.
      - name: Upload build artifact
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: build/output/nexis
          retention-days: 3

  build-macos:
    name: macOS (ARM64)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Doc version header check
        run: bash scripts/check_doc_versions.sh

      - name: Architecture gate — no platform headers in shared/Pages
        run: bash scripts/check-pages-no-platform-headers.sh

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            brew install qt@6 && break
            echo "brew install attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Unit Tests
        run: ctest --test-dir build --output-on-failure -E ScreenshotTests

      - name: Screenshot regression tests (non-blocking)
        id: screenshot_tests
        continue-on-error: true
        timeout-minutes: 8   # a hang fails this non-blocking step fast instead of stalling the job
        run: ctest --test-dir build --output-on-failure -R ScreenshotTests

      # SSO-23450: continue-on-error above means the job never registers as
      # `failure()` from this step alone — check the step's own outcome
      # instead, so 65 stored copies of diffs nobody reads on green runs
      # stop happening.
      - name: Upload screenshot diffs
        if: steps.screenshot_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs-nexis-macos-arm64
          path: build/tests/test_screenshots/
          if-no-files-found: ignore
          retention-days: 1

      # SSO-23450: same rationale as the Linux upload above — gated behind
      # workflow_dispatch instead of firing on every push to native.
      - name: Upload build artifact
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexis-macos-arm64
          path: build/output/nexis.app
          retention-days: 3
