name: Build

on:
  push:
    branches: [native, master, main]
  pull_request:
    branches: [native, master, main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux (x64)
            artifact-name: nexis-linux-x64
            artifact-path: build/output/nexis
          - os: ubuntu-24.04-arm
            name: Linux (ARM64)
            artifact-name: nexis-linux-arm64
            artifact-path: build/output/nexis
          - os: macos-14
            name: macOS (ARM64)
            artifact-name: nexis-macos-arm64
            artifact-path: build/output/nexis.app

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # WI-30: keep the living architecture/overview docs in sync with the
      # CMake project version. Cheap, no dependencies — runs on every matrix
      # leg so a drift is caught on the same PR that introduces it.
      - name: Doc version header check
        run: bash scripts/check_doc_versions.sh

      # --- Linux dependencies ---
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            g++ \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-charts-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6charts6-dev \
            libqt6svg6-dev \
            xvfb

      # --- macOS dependencies ---
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for i in 1 2 3; do
            brew install qt@6 && break
            echo "brew install attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu 2>/dev/null || nproc)

      - name: Unit Tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build --output-on-failure -E ScreenshotTests
          else
            ctest --test-dir build --output-on-failure -E ScreenshotTests
          fi

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 14
