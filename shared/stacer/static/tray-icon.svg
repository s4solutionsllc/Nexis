<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <!-- Simple gauge icon for system tray - works on light and dark backgrounds -->
  <!-- Outer ring with semi-transparent fill for visibility on any background -->
  <circle cx="11" cy="11" r="10" fill="none" stroke="#2ec27e" stroke-width="1.5"/>
  <!-- Gauge arc -->
  <path d="M 3.5 14.5 A 8.5 8.5 0 1 1 18.5 14.5" fill="none" stroke="#2ec27e" stroke-width="2" stroke-linecap="round"/>
  <!-- Needle pointing upper-left (like the logo) -->
  <line x1="11" y1="11" x2="6" y2="6" stroke="#2ec27e" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="11" cy="11" r="1.5" fill="#2ec27e"/>
</svg>
