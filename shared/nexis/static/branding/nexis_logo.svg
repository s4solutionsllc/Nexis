<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="30%" stop-color="#FF6B1A"/>
      <stop offset="60%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>

    <linearGradient id="swooshGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0"/>
      <stop offset="15%" stop-color="#FF4500" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FF6B1A" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="1"/>
      <stop offset="85%" stop-color="#FFB347" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0"/>
    </linearGradient>

    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF6B1A" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#orangeGlow)">
    <text x="300" y="125" 
          font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif" 
          font-size="108" 
          font-weight="700" 
          letter-spacing="12"
          text-anchor="middle"
          fill="#1A1A1A"
          opacity="0.5"
          transform="translate(0, 3)">
      NEXIS
    </text>

    <text x="300" y="125" 
          font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif" 
          font-size="108" 
          font-weight="700" 
          letter-spacing="12"
          text-anchor="middle"
          fill="url(#textGradient)">
      NEXIS
    </text>
  </g>

  <!-- Horizontal swoosh underline with gentle arc -->
  <path d="M 160 152 Q 300 162 440 152" 
        stroke="url(#swooshGradient)" 
        stroke-width="3" 
        stroke-linecap="round"
        fill="none"/>
</svg>
