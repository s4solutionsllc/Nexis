<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C64516"/>
      <stop offset="30%" stop-color="#E95420"/>
      <stop offset="60%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <linearGradient id="swooshGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C64516" stop-opacity="0"/>
      <stop offset="15%" stop-color="#C64516" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#E95420" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF6B1A" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#FF8C00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F0EB"/>
    </linearGradient>

    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#E95420" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Light background -->
  <rect width="600" height="200" rx="16" fill="url(#bgGradient)"/>
  <rect width="600" height="200" rx="16" fill="none" stroke="#D0C9C0" stroke-width="1" opacity="0.5"/>

  <!-- Main wordmark -->
  <g filter="url(#orangeGlow)">
    <text x="300" y="115"
          font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif"
          font-size="108"
          font-weight="700"
          letter-spacing="12"
          text-anchor="middle"
          fill="url(#textGradient)">
      NEXIS
    </text>
  </g>

  <!-- Horizontal swoosh underline with gentle arc -->
  <path d="M 160 140 Q 300 150 440 140"
        stroke="url(#swooshGradient)"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"/>

  <!-- Tagline -->
  <text x="300" y="170"
        font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif"
        font-size="13"
        font-weight="400"
        letter-spacing="6"
        text-anchor="middle"
        fill="#6B6E78"
        opacity="0.85">
    SYSTEM OPTIMIZATION
  </text>
</svg>
