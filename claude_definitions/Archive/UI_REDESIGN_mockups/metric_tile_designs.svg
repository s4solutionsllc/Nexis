  <text x="892" y="702" font-family="SF Pro Display, sans-serif" font-size="10" fill="#FFB347">2.1 GB reclaimable</text>

  <text x="608" y="722" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">media • Ubuntu 24.04 LTS • AMD Ryzen 7 5700X • 31.2 GiB RAM • Uptime 3d 14h</text>

  <!-- ===== DESIGN 6: Comparison - Current vs Proposed ===== -->
  <text x="40" y="760" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="600" fill="#FF6B1A">Comparison: Current CircleBar vs Proposed Metric Tile</text>

  <!-- Current -->
  <rect x="40" y="776" width="160" height="110" rx="12" fill="#2A2C32" filter="url(#cs6)"/>
  <text x="120" y="798" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78" text-anchor="middle">CURRENT</text>
  <text x="120" y="818" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78" text-anchor="middle">CPU</text>
