  <rect x="728" y="574" width="116" height="24" rx="12" fill="#32343A" stroke="#3A3D4A" stroke-width="1"/>
  <text x="786" y="590" font-family="SF Pro Display, sans-serif" font-size="10" fill="#9A9DA6" text-anchor="middle">View Processes</text>

  <rect x="854" y="574" width="120" height="24" rx="12" fill="#32343A" stroke="#3A3D4A" stroke-width="1"/>
