  <text x="400" y="798" font-family="SF Pro Display, sans-serif" font-size="9" fill="#FF6B1A" text-anchor="middle">PROPOSED</text>
  <text x="284" y="818" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">CPU</text>
  <text x="284" y="838" font-family="SF Pro Display, sans-serif" font-size="20" font-weight="700" fill="#F0F2F5">22%</text>
  <text x="328" y="838" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">2.83 GHz</text>
