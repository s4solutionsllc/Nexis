  <path d="M 338 454 L 552 454" stroke="#32343A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 338 454 L 372 454" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>

  <rect x="592" y="356" width="260" height="120" rx="12" fill="#2A2C32" filter="url(#cs6)"/>
  <rect x="592" y="356" width="260" height="120" rx="12" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <text x="614" y="382" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="600" fill="#6B6E78" letter-spacing="1">TEMP</text>
  <text x="614" y="410" font-family="SF Pro Display, sans-serif" font-size="28" font-weight="700" fill="#F0F2F5">29.9°C</text>
  <polyline points="614,434 634,432 654,436 674,430 694,434 714,428 734,436 754,432 774,430 794,434 814,432 828,433"
