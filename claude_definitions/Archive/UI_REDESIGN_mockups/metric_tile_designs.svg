  <text x="68" y="596" font-family="SF Pro Display, sans-serif" font-size="10" fill="#26A69A">↓ DOWNLOAD</text>
  <text x="260" y="596" font-family="SF Pro Display, sans-serif" font-size="24" font-weight="700" fill="#F0F2F5" text-anchor="end">28.7 KB/s</text>
  <polyline points="68,614 88,612 108,616 128,606 148,620 168,604 188,614 208,602 228,618 248,610 260,614"
            fill="none" stroke="#26A69A" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="68,614 88,612 108,616 128,606 148,620 168,604 188,614 208,602 228,618 248,610 260,614 260,630 68,630"
