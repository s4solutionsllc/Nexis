  <text x="300" y="672" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Total ↑ 25.8 GiB</text>
  <text x="512" y="672" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78" text-anchor="end">eth0</text>
