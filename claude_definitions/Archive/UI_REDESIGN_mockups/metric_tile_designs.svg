  <text x="338" y="382" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="600" fill="#6B6E78" letter-spacing="1">MEMORY</text>
  <text x="338" y="410" font-family="SF Pro Display, sans-serif" font-size="28" font-weight="700" fill="#F0F2F5">16%</text>
  <text x="394" y="410" font-family="SF Pro Display, sans-serif" font-size="11" fill="#6B6E78">5.0 / 31.2 GiB</text>
  <polyline points="338,434 358,433 378,434 398,433 418,435 438,432 458,434 478,433 498,435 518,433 538,434 552,433"
