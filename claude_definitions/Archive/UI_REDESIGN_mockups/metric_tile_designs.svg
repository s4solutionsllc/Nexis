  <path d="M 890 454 L 1104 454" stroke="#32343A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 890 454 L 1072 454" stroke="#2EC27E" stroke-width="4" stroke-linecap="round"/>
  <text x="1104" y="382" font-family="SF Pro Display, sans-serif" font-size="10" fill="#2EC27E" text-anchor="end">Healthy</text>

  <!-- ===== DESIGN 3: Network Tile ===== -->
  <text x="40" y="520" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="600" fill="#FF6B1A">Design 3: Dual-Metric Network Tile</text>

  <rect x="40" y="536" width="500" height="180" rx="16" fill="#2A2C32" filter="url(#cs6)"/>
  <rect x="40" y="536" width="500" height="180" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
