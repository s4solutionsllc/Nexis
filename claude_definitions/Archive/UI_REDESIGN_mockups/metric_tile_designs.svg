  <text x="828" y="382" font-family="SF Pro Display, sans-serif" font-size="10" fill="#5B9BD5" text-anchor="end">normal</text>

  <rect x="868" y="356" width="260" height="120" rx="12" fill="#2A2C32" filter="url(#cs6)"/>
  <rect x="868" y="356" width="260" height="120" rx="12" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <text x="890" y="382" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="600" fill="#6B6E78" letter-spacing="1">BATTERY</text>
  <text x="890" y="410" font-family="SF Pro Display, sans-serif" font-size="28" font-weight="700" fill="#F0F2F5">85%</text>
  <polyline points="890,434 910,433 930,432 950,434 970,433 990,432 1010,434 1030,433 1050,432 1070,433 1090,432 1104,433"
