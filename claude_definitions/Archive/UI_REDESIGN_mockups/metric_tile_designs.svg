<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="og6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="30%" stop-color="#FF6B1A"/>
      <stop offset="60%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="cs6">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#1A1C22"/>

  <text x="600" y="40" font-family="SF Pro Display, sans-serif" font-size="18" font-weight="700" fill="url(#og6)" text-anchor="middle">Metric Tile Widget Designs</text>
  <text x="600" y="62" font-family="SF Pro Display, sans-serif" font-size="12" fill="#6B6E78" text-anchor="middle">Replacing CircleBar gauges with information-dense rectangular tiles</text>

  <!-- ===== DESIGN 1: Full Metric Tile ===== -->
  <text x="40" y="100" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="600" fill="#FF6B1A">Design 1: Full Metric Tile (Recommended for Dashboard)</text>

  <!-- CPU Tile -->
  <rect x="40" y="116" width="340" height="180" rx="16" fill="#2A2C32" filter="url(#cs6)"/>
  <rect x="40" y="116" width="340" height="180" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <!-- Header -->
  <text x="68" y="146" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#6B6E78" letter-spacing="1.5">CPU</text>
  <text x="348" y="146" font-family="SF Pro Display, sans-serif" font-size="10" fill="#2EC27E" text-anchor="end">↓ -3%</text>
  <!-- Big number -->
  <text x="68" y="190" font-family="SF Pro Display, sans-serif" font-size="40" font-weight="700" fill="#F0F2F5">22%</text>
  <text x="160" y="190" font-family="SF Pro Display, sans-serif" font-size="14" fill="#6B6E78">2.83 GHz</text>
  <!-- Sparkline -->
  <polyline points="68,215 88,212 108,218 128,206 148,224 168,202 188,214 208,200 228,220 248,208 268,214 288,210 308,218 328,212 348,208"
            fill="none" stroke="#FF6B1A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="68,215 88,212 108,218 128,206 148,224 168,202 188,214 208,200 228,220 248,208 268,214 288,210 308,218 328,212 348,208 348,232 68,232"
            fill="#FF6B1A" opacity="0.06"/>
  <!-- Progress bar gauge -->
  <path d="M 68 252 L 348 252" stroke="#32343A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 68 252 L 130 252" stroke="#FF6B1A" stroke-width="6" stroke-linecap="round"/>
  <!-- Subtitle -->
  <text x="68" y="276" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Ryzen 7 5700X • 8 cores</text>
  <text x="348" y="276" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78" text-anchor="end">60s history</text>

  <!-- Memory Tile -->
  <rect x="400" y="116" width="340" height="180" rx="16" fill="#2A2C32" filter="url(#cs6)"/>
  <rect x="400" y="116" width="340" height="180" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <text x="428" y="146" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#6B6E78" letter-spacing="1.5">MEMORY</text>
  <text x="708" y="146" font-family="SF Pro Display, sans-serif" font-size="10" fill="#9A9DA6" text-anchor="end">→ stable</text>
  <text x="428" y="190" font-family="SF Pro Display, sans-serif" font-size="40" font-weight="700" fill="#F0F2F5">16%</text>
  <text x="518" y="190" font-family="SF Pro Display, sans-serif" font-size="14" fill="#6B6E78">5.0 / 31.2 GiB</text>
  <polyline points="428,215 448,214 468,215 488,214 508,216 528,213 548,215 568,214 588,216 608,214 628,215 648,213 668,215 688,214 708,215"
            fill="none" stroke="#FFB347" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="428,215 448,214 468,215 488,214 508,216 528,213 548,215 568,214 588,216 608,214 628,215 648,213 668,215 688,214 708,215 708,232 428,232"
            fill="#FFB347" opacity="0.06"/>
  <path d="M 428 252 L 708 252" stroke="#32343A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 428 252 L 473 252" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
  <text x="428" y="276" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Swap: 308 KiB / 8.0 GiB (0%)</text>

  <!-- Disk Tile (with donut variant) -->
  <rect x="760" y="116" width="340" height="180" rx="16" fill="#2A2C32" filter="url(#cs6)"/>
  <rect x="760" y="116" width="340" height="180" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <text x="788" y="146" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#6B6E78" letter-spacing="1.5">DISK</text>
  <!-- Donut gauge (for disk, donut is better than bar) -->
  <circle cx="860" cy="218" r="40" fill="none" stroke="#32343A" stroke-width="8"/>
  <circle cx="860" cy="218" r="40" fill="none" stroke="#E05454" stroke-width="8"
          stroke-dasharray="23 229" stroke-dashoffset="0" transform="rotate(-90 860 218)"/>
  <text x="860" y="214" font-family="SF Pro Display, sans-serif" font-size="20" font-weight="700" fill="#F0F2F5" text-anchor="middle">9%</text>
  <text x="860" y="232" font-family="SF Pro Display, sans-serif" font-size="8" fill="#6B6E78" text-anchor="middle">83.8/937 GiB</text>
  <!-- Side info -->
  <text x="920" y="180" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">NVMe 1:</text>
  <circle cx="972" cy="177" r="3" fill="#2EC27E"/>
  <text x="980" y="180" font-family="SF Pro Display, sans-serif" font-size="10" fill="#2EC27E">Good</text>
  <text x="920" y="198" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">NVMe 2:</text>
  <circle cx="972" cy="195" r="3" fill="#2EC27E"/>
  <text x="980" y="198" font-family="SF Pro Display, sans-serif" font-size="10" fill="#2EC27E">Good</text>
  <text x="920" y="220" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">30°C / 28°C</text>
  <!-- Quick action chip -->
  <rect x="920" y="236" width="100" height="22" rx="11" fill="#FF6B1A" opacity="0.12" stroke="#FF6B1A" stroke-width="0.5"/>
  <text x="970" y="250" font-family="SF Pro Display, sans-serif" font-size="9" font-weight="600" fill="#FF6B1A" text-anchor="middle">Clean 2.1 GB →</text>

  <!-- ===== DESIGN 2: Compact Metric Tile ===== -->
  <text x="40" y="340" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="600" fill="#FF6B1A">Design 2: Compact Metric Tile (For 4-column grid or smaller windows)</text>

  <rect x="40" y="356" width="260" height="120" rx="12" fill="#2A2C32" filter="url(#cs6)"/>
  <rect x="40" y="356" width="260" height="120" rx="12" fill="none" stroke="#3A3D4A" stroke-width="1"/>
