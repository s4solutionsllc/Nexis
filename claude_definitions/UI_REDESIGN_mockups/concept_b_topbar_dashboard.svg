    <rect x="612" y="290" width="280" height="160" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
    <text x="640" y="318" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#6B6E78" letter-spacing="1">NETWORK</text>
    <text x="640" y="348" font-family="SF Pro Display, sans-serif" font-size="10" fill="#26A69A">↓</text>
    <text x="654" y="348" font-family="SF Pro Display, sans-serif" font-size="22" font-weight="600" fill="#F0F2F5">28.7 KB/s</text>
    <text x="640" y="376" font-family="SF Pro Display, sans-serif" font-size="10" fill="#E05454">↑</text>
    <text x="654" y="376" font-family="SF Pro Display, sans-serif" font-size="22" font-weight="600" fill="#F0F2F5">8.0 KB/s</text>
