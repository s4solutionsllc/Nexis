    <polyline points="52,170 72,166 92,174 112,160 132,178 152,156 172,168 192,154 212,174 232,162 252,168 272,164 292,172 312,166 332,162 352,168 372,164 372,190 52,190"
              fill="#FF6B1A" opacity="0.06"/>
    <!-- Gauge bar -->
    <path d="M 52 208 L 372 208" stroke="#32343A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 52 208 L 123 208" stroke="#FF6B1A" stroke-width="6" stroke-linecap="round"/>
    <text x="52" y="230" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Ryzen 7 5700X • 8C/16T</text>
    <text x="372" y="230" font-family="SF Pro Display, sans-serif" font-size="10" fill="#2EC27E" text-anchor="end">↓ stable</text>
    <!-- Details link -->
    <text x="372" y="258" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="600" fill="#FF6B1A" text-anchor="end">Details →</text>
  </g>

  <g>
    <!-- Memory Card -->
    <rect x="416" y="72" width="380" height="200" rx="16" fill="#2A2C32" filter="url(#cs4)"/>
    <rect x="416" y="72" width="380" height="200" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
    <text x="444" y="100" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#6B6E78" letter-spacing="1">MEMORY</text>
    <text x="444" y="140" font-family="SF Pro Display, sans-serif" font-size="44" font-weight="700" fill="#F0F2F5">16%</text>
    <text x="544" y="140" font-family="SF Pro Display, sans-serif" font-size="16" fill="#6B6E78">5.0 / 31.2 GiB</text>
    <polyline points="444,170 464,169 484,170 504,169 524,171 544,168 564,170 584,169 604,171 624,169 644,170 664,168 684,170 704,169 724,170 744,169 764,170"
