  <text x="1020" y="30" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Search...</text>
  <text x="1124" y="30" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Ctrl+K</text>

  <!-- Settings icon -->
  <circle cx="1168" cy="26" r="12" fill="#2A2C32"/>
  <circle cx="1168" cy="26" r="6" fill="none" stroke="#9A9DA6" stroke-width="1.3"/>
  <circle cx="1168" cy="26" r="2" fill="#9A9DA6"/>

  <!-- ===== DASHBOARD CONTENT (Full Width!) ===== -->

  <!-- Row 1: 3 Equal Cards -->
  <g>
    <!-- CPU Card -->
    <rect x="24" y="72" width="380" height="200" rx="16" fill="#2A2C32" filter="url(#cs4)"/>
    <rect x="24" y="72" width="380" height="200" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
    <text x="52" y="100" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#6B6E78" letter-spacing="1">CPU</text>
    <text x="52" y="140" font-family="SF Pro Display, sans-serif" font-size="44" font-weight="700" fill="#F0F2F5">22%</text>
    <text x="158" y="140" font-family="SF Pro Display, sans-serif" font-size="16" fill="#6B6E78">2.83 GHz</text>
    <!-- Sparkline -->
    <polyline points="52,170 72,166 92,174 112,160 132,178 152,156 172,168 192,154 212,174 232,162 252,168 272,164 292,172 312,166 332,162 352,168 372,164"
