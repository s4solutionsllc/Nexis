  <!-- Row 3: System Health Summary (full width) -->
  <rect x="24" y="466" width="1156" height="60" rx="16" fill="#2A2C32" filter="url(#cs4)"/>
  <rect x="24" y="466" width="1156" height="60" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <text x="52" y="492" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#6B6E78" letter-spacing="1">SYSTEM HEALTH</text>
  <circle cx="164" cy="488" r="4" fill="#2EC27E"/>
  <text x="176" y="492" font-family="SF Pro Display, sans-serif" font-size="11" fill="#F0F2F5">All drives healthy</text>
  <circle cx="322" cy="488" r="4" fill="#2EC27E"/>
  <text x="334" y="492" font-family="SF Pro Display, sans-serif" font-size="11" fill="#F0F2F5">Battery OK</text>
  <circle cx="440" cy="488" r="4" fill="#FFB347"/>
  <text x="452" y="492" font-family="SF Pro Display, sans-serif" font-size="11" fill="#F0F2F5">2.1 GB reclaimable</text>
  <text x="52" y="514" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">media • Ubuntu 24.04 • Ryzen 7 5700X • Last clean: 2h ago • Next: Tomorrow 3:00 AM</text>

  <!-- Dropdown menu showing (Hardware) -->
  <rect x="220" y="52" width="180" height="90" rx="12" fill="#2A2C32" filter="url(#cs4)" stroke="#3A3D4A" stroke-width="1"/>
  <rect x="232" y="62" width="156" height="30" rx="6" fill="#32343A"/>
  <text x="248" y="82" font-family="SF Pro Display, sans-serif" font-size="12" fill="#F0F2F5">Hardware Info</text>
  <text x="248" y="114" font-family="SF Pro Display, sans-serif" font-size="12" fill="#9A9DA6">Resources</text>

  <!-- Footer -->
  <rect x="0" y="776" width="1200" height="24" fill="#222228"/>
  <text x="24" y="792" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Ctrl+K: Command Palette</text>
  <text x="1176" y="792" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78" text-anchor="end">Nexis v1.2.1</text>

  <!-- Title -->
  <text x="600" y="568" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#FF6B1A" text-anchor="middle">Concept B: Top-Bar Navigation — Full-Width Dashboard Hub</text>
  <text x="600" y="588" font-family="SF Pro Display, sans-serif" font-size="11" fill="#6B6E78" text-anchor="middle">No sidebar • Dropdown menus for categories • Maximum content width • "Details →" links to subpages • Health summary bar</text>
</svg>
