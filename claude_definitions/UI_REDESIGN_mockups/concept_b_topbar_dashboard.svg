    <text x="346" y="418" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">NVMe - Sensor 2</text>
    <text x="566" y="418" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="600" fill="#FF6B1A" text-anchor="end">Details →</text>
  </g>

