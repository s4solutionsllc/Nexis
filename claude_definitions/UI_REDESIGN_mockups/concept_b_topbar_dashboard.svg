    <text x="640" y="418" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">↓ 9.2 GiB • ↑ 25.8 GiB total</text>
    <text x="860" y="418" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="600" fill="#FF6B1A" text-anchor="end">Details →</text>
  </g>

  <g>
    <!-- Battery -->
    <rect x="906" y="290" width="274" height="160" rx="16" fill="#2A2C32" filter="url(#cs4)"/>
    <rect x="906" y="290" width="274" height="160" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
    <text x="934" y="318" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#6B6E78" letter-spacing="1">BATTERY</text>
    <text x="934" y="354" font-family="SF Pro Display, sans-serif" font-size="34" font-weight="700" fill="#F0F2F5">85%</text>
    <rect x="1030" y="334" width="36" height="18" rx="3" fill="none" stroke="#2EC27E" stroke-width="1.5"/>
    <rect x="1066" y="338" width="4" height="10" rx="1" fill="#2EC27E"/>
    <rect x="1033" y="337" width="27" height="12" rx="1.5" fill="#2EC27E"/>
    <polyline points="934,382 954,381 974,380 994,382 1014,381 1034,380 1054,382 1074,381 1094,380 1114,381 1134,380 1148,381"
