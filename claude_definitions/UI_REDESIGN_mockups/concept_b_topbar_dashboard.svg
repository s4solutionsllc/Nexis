    <text x="934" y="418" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Charging • Healthy • ~2h 15m</text>
    <text x="1148" y="418" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="600" fill="#FF6B1A" text-anchor="end">Details →</text>
