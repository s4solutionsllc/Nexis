    <path d="M 444 208 L 764 208" stroke="#32343A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 444 208 L 495 208" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
    <text x="444" y="230" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Swap: 308 KiB / 8.0 GiB (0%)</text>
    <text x="764" y="230" font-family="SF Pro Display, sans-serif" font-size="10" fill="#2EC27E" text-anchor="end">→ stable</text>
