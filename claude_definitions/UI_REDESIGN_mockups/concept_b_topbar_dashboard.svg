<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="og4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="30%" stop-color="#FF6B1A"/>
      <stop offset="60%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="cs4">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#1A1C22"/>

  <!-- ===== TOP NAVIGATION BAR ===== -->
  <rect x="0" y="0" width="1200" height="52" fill="#222228"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#3A3D4A" stroke-width="1"/>

  <!-- Logo -->
  <text x="28" y="33" font-family="SF Pro Display, Helvetica Neue, sans-serif" font-size="18" font-weight="700" fill="url(#og4)" letter-spacing="2">NEXIS</text>

  <!-- Nav items -->
  <!-- Dashboard (active) -->
  <rect x="120" y="10" width="100" height="32" rx="8" fill="#FF6B1A" opacity="0.15"/>
  <text x="170" y="31" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="600" fill="#FF6B1A" text-anchor="middle">Dashboard</text>
  <rect x="145" y="48" width="50" height="3" rx="1.5" fill="#FF6B1A"/>

  <!-- Hardware dropdown -->
  <text x="268" y="31" font-family="SF Pro Display, sans-serif" font-size="13" fill="#9A9DA6" text-anchor="middle">Hardware ▾</text>

  <!-- Tools dropdown -->
  <text x="368" y="31" font-family="SF Pro Display, sans-serif" font-size="13" fill="#9A9DA6" text-anchor="middle">Tools ▾</text>

  <!-- System dropdown -->
  <text x="460" y="31" font-family="SF Pro Display, sans-serif" font-size="13" fill="#9A9DA6" text-anchor="middle">System ▾</text>

  <!-- Right side: Search + Settings -->
