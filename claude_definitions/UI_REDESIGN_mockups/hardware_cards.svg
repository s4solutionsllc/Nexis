  <rect x="448" y="272" width="732" height="290" rx="16" fill="#2A2C32" filter="url(#cs8)"/>
  <rect x="448" y="272" width="732" height="290" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <rect x="470" y="290" width="32" height="32" rx="8" fill="#E05454" opacity="0.1"/>
  <text x="486" y="312" font-family="SF Pro Display, sans-serif" font-size="16" fill="#E05454" text-anchor="middle">💾</text>
  <text x="512" y="304" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#F0F2F5">Storage</text>
  <text x="512" y="320" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Drives and SMART health</text>

  <line x1="470" y1="332" x2="1152" y2="332" stroke="#3A3D4A" stroke-width="1"/>

  <!-- Drive 1 -->
  <rect x="470" y="344" width="694" height="92" rx="12" fill="#32343A"/>
  <!-- Health badge -->
  <rect x="486" y="356" width="60" height="22" rx="11" fill="#2EC27E" opacity="0.15"/>
  <circle cx="498" cy="367" r="4" fill="#2EC27E"/>
  <text x="508" y="371" font-family="SF Pro Display, sans-serif" font-size="9" font-weight="600" fill="#2EC27E">Good</text>

  <text x="560" y="371" font-family="SF Pro Display, sans-serif" font-size="12" font-weight="600" fill="#F0F2F5">NVMe 1</text>
  <text x="660" y="371" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">937 GB NVMe</text>

  <!-- Usage bar -->
  <path d="M 486 392 L 1148 392" stroke="#222228" stroke-width="6" stroke-linecap="round"/>
  <path d="M 486 392 L 546 392" stroke="#E05454" stroke-width="6" stroke-linecap="round"/>
  <text x="486" y="412" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">83.8 GiB used of 937 GiB (9%)</text>

  <!-- SMART stats inline -->
  <text x="700" y="412" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Temp: 30°C</text>
  <text x="800" y="412" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Endurance: 98%</text>
  <text x="920" y="412" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Written: 12.4 TB</text>
  <text x="1050" y="412" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Errors: 0</text>
  <!-- Expand arrow -->
  <text x="1148" y="371" font-family="sans-serif" font-size="12" fill="#6B6E78" text-anchor="end">▸</text>

  <!-- Drive 2 -->
  <rect x="470" y="446" width="694" height="92" rx="12" fill="#32343A"/>
  <rect x="486" y="458" width="60" height="22" rx="11" fill="#2EC27E" opacity="0.15"/>
  <circle cx="498" cy="469" r="4" fill="#2EC27E"/>
  <text x="508" y="473" font-family="SF Pro Display, sans-serif" font-size="9" font-weight="600" fill="#2EC27E">Good</text>

  <text x="560" y="473" font-family="SF Pro Display, sans-serif" font-size="12" font-weight="600" fill="#F0F2F5">NVMe 2</text>
  <text x="660" y="473" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">512 GB NVMe</text>

  <path d="M 486 494 L 1148 494" stroke="#222228" stroke-width="6" stroke-linecap="round"/>
  <path d="M 486 494 L 520 494" stroke="#E05454" stroke-width="6" stroke-linecap="round"/>
  <text x="486" y="514" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">42.1 GiB used of 512 GiB (8%)</text>
  <text x="700" y="514" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Temp: 28°C</text>
  <text x="800" y="514" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Endurance: 99%</text>
  <text x="920" y="514" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Written: 4.2 TB</text>
  <text x="1050" y="514" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">Errors: 0</text>
  <text x="1148" y="473" font-family="sans-serif" font-size="12" fill="#6B6E78" text-anchor="end">▸</text>

  <!-- Battery Card -->
  <rect x="84" y="448" width="350" height="160" rx="16" fill="#2A2C32" filter="url(#cs8)"/>
  <rect x="84" y="448" width="350" height="160" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <rect x="106" y="466" width="32" height="32" rx="8" fill="#2EC27E" opacity="0.1"/>
  <text x="122" y="488" font-family="SF Pro Display, sans-serif" font-size="16" fill="#2EC27E" text-anchor="middle">🔋</text>
  <text x="148" y="480" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#F0F2F5">Battery</text>
  <!-- Health badge -->
  <rect x="210" y="470" width="56" height="18" rx="9" fill="#2EC27E" opacity="0.15"/>
  <text x="238" y="483" font-family="SF Pro Display, sans-serif" font-size="9" font-weight="600" fill="#2EC27E" text-anchor="middle">Healthy</text>

  <line x1="106" y1="508" x2="406" y2="508" stroke="#3A3D4A" stroke-width="1"/>

  <!-- Battery bar -->
  <path d="M 106 524 L 406 524" stroke="#32343A" stroke-width="8" stroke-linecap="round"/>
  <path d="M 106 524 L 361 524" stroke="#2EC27E" stroke-width="8" stroke-linecap="round"/>
  <text x="106" y="546" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" font-weight="600">85%</text>
  <text x="150" y="546" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Charging</text>

  <text x="106" y="568" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Cycles: 523</text>
  <text x="240" y="568" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Temp: 32°C</text>

  <text x="106" y="588" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Remaining: ~2h 15m</text>
  <text x="310" y="588" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Capacity: 92%</text>

  <!-- Title -->
  <text x="640" y="640" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#FF6B1A" text-anchor="middle">Hardware Info Redesign: Card Grid with Expandable Drive Details</text>
  <text x="640" y="660" font-family="SF Pro Display, sans-serif" font-size="11" fill="#6B6E78" text-anchor="middle">Categorized cards with colored headers • Inline SMART stats • Usage bars • Health badges • Expand for full details</text>
</svg>
