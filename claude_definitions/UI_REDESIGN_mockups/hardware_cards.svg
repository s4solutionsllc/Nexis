<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="og8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="30%" stop-color="#FF6B1A"/>
      <stop offset="60%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="cs8">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#1A1C22"/>

  <!-- Collapsed sidebar -->
  <rect x="0" y="0" width="64" height="700" fill="#222228"/>
  <line x1="64" y1="0" x2="64" y2="700" stroke="#3A3D4A" stroke-width="1"/>
  <text x="32" y="32" font-family="SF Pro Display, sans-serif" font-size="18" font-weight="700" fill="url(#og8)" text-anchor="middle">N</text>
  <line x1="14" y1="44" x2="50" y2="44" stroke="#3A3D4A" stroke-width="1"/>
  <!-- Hardware icon (selected) -->
  <rect x="10" y="100" width="44" height="40" rx="10" fill="#FF6B1A" opacity="0.15"/>
  <rect x="10" y="100" width="3" height="40" rx="1.5" fill="#FF6B1A"/>
  <rect x="22" y="112" width="16" height="12" rx="2" fill="none" stroke="#FF6B1A" stroke-width="1.3"/>
  <line x1="26" y1="116" x2="34" y2="116" stroke="#FF6B1A" stroke-width="1"/>
  <line x1="26" y1="119" x2="32" y2="119" stroke="#FF6B1A" stroke-width="1"/>

  <!-- Page title -->
  <text x="90" y="36" font-family="SF Pro Display, sans-serif" font-size="16" font-weight="700" fill="#F0F2F5">Hardware Info</text>

  <!-- ===== CARD GRID LAYOUT ===== -->

  <!-- Row 1: System + Processor + Graphics -->

  <!-- System Card -->
  <rect x="84" y="56" width="350" height="200" rx="16" fill="#2A2C32" filter="url(#cs8)"/>
  <rect x="84" y="56" width="350" height="200" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <!-- Card header with icon -->
  <rect x="106" y="74" width="32" height="32" rx="8" fill="#FF6B1A" opacity="0.1"/>
  <text x="122" y="96" font-family="SF Pro Display, sans-serif" font-size="16" fill="#FF6B1A" text-anchor="middle">💻</text>
  <text x="148" y="88" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#F0F2F5">System</text>
  <text x="148" y="104" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Operating system and platform</text>

  <line x1="106" y1="116" x2="406" y2="116" stroke="#3A3D4A" stroke-width="1"/>

  <!-- Key-value pairs -->
  <text x="106" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Hostname</text>
  <text x="406" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">media</text>

  <text x="106" y="158" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Platform</text>
  <text x="406" y="158" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">linux_x86_64</text>

  <text x="106" y="178" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Distribution</text>
  <text x="406" y="178" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">Ubuntu 24.04.4 LTS</text>

  <text x="106" y="198" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Kernel</text>
  <text x="406" y="198" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">6.17.0-14-generic</text>

  <text x="106" y="218" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Architecture</text>
  <text x="406" y="218" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">x86_64</text>

  <text x="106" y="238" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Desktop</text>
  <text x="406" y="238" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">ubuntu:GNOME</text>

  <!-- Processor Card -->
  <rect x="448" y="56" width="370" height="200" rx="16" fill="#2A2C32" filter="url(#cs8)"/>
  <rect x="448" y="56" width="370" height="200" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <rect x="470" y="74" width="32" height="32" rx="8" fill="#FFB347" opacity="0.1"/>
  <text x="486" y="96" font-family="SF Pro Display, sans-serif" font-size="16" fill="#FFB347" text-anchor="middle">⚡</text>
  <text x="512" y="88" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#F0F2F5">Processor</text>
  <text x="512" y="104" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">AMD Ryzen 7 5700X 8-Core</text>

  <line x1="470" y1="116" x2="790" y2="116" stroke="#3A3D4A" stroke-width="1"/>

  <text x="470" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Physical Cores</text>
  <text x="790" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">8</text>

  <text x="470" y="158" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Logical Cores</text>
  <text x="790" y="158" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">8</text>

  <text x="470" y="178" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Base Clock</text>
  <text x="790" y="178" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">4.67 GHz</text>

  <text x="470" y="198" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">L1 Cache</text>
  <text x="790" y="198" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">32K (D) / 32K (I)</text>

  <text x="470" y="218" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">L2 Cache</text>
  <text x="790" y="218" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">512K Unified</text>

  <text x="470" y="238" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">L3 Cache</text>
  <text x="790" y="238" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">32 MB Unified</text>

  <!-- Graphics Card -->
  <rect x="832" y="56" width="348" height="200" rx="16" fill="#2A2C32" filter="url(#cs8)"/>
  <rect x="832" y="56" width="348" height="200" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <rect x="854" y="74" width="32" height="32" rx="8" fill="#813D9C" opacity="0.1"/>
  <text x="870" y="96" font-family="SF Pro Display, sans-serif" font-size="16" fill="#813D9C" text-anchor="middle">🎮</text>
  <text x="896" y="88" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#F0F2F5">Graphics</text>
  <text x="896" y="104" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">GPU devices</text>

  <line x1="854" y1="116" x2="1152" y2="116" stroke="#3A3D4A" stroke-width="1"/>

  <text x="854" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">GPU 1</text>
  <text x="1152" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">NVIDIA GPU 1</text>

  <text x="854" y="158" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Vendor</text>
  <text x="1152" y="158" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">NVIDIA</text>

  <text x="854" y="178" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Usage</text>
  <text x="1152" y="178" font-family="SF Pro Display, sans-serif" font-size="10" fill="#9A9DA6" text-anchor="end">0% (idle)</text>

  <!-- Row 2: Memory + Storage -->

  <!-- Memory Card -->
  <rect x="84" y="272" width="350" height="160" rx="16" fill="#2A2C32" filter="url(#cs8)"/>
  <rect x="84" y="272" width="350" height="160" rx="16" fill="none" stroke="#3A3D4A" stroke-width="1"/>
  <rect x="106" y="290" width="32" height="32" rx="8" fill="#26A69A" opacity="0.1"/>
  <text x="122" y="312" font-family="SF Pro Display, sans-serif" font-size="16" fill="#26A69A" text-anchor="middle">🧠</text>
  <text x="148" y="304" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#F0F2F5">Memory</text>
  <text x="148" y="320" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">RAM and swap</text>

  <line x1="106" y1="332" x2="406" y2="332" stroke="#3A3D4A" stroke-width="1"/>

