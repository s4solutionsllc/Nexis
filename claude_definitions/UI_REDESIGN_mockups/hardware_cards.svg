  <path d="M 106 366 L 154 366" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
  <text x="106" y="384" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">5.0 GiB used (16%)</text>

  <!-- Swap bar -->
  <text x="106" y="406" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6B6E78">Swap</text>
  <text x="406" y="406" font-family="SF Pro Display, sans-serif" font-size="10" fill="#F0F2F5" text-anchor="end">8.0 GiB</text>
  <path d="M 106 418 L 406 418" stroke="#32343A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 106 418 L 107 418" stroke="#26A69A" stroke-width="6" stroke-linecap="round"/>
  <text x="106" y="416" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6B6E78">308 KiB used (0%)</text>

