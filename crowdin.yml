project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
base_url: "https://api.crowdin.com"

files:
  - source: /shared/translations/nexis_en.ts
    translation: /shared/translations/nexis_%two_letters_code%.ts
    languages_mapping:
      two_letters_code:
        zh-CN: zh-cn
        zh-TW: zh-tw
        ca-ES: ca-es
        uk: ua
        vi: vn
